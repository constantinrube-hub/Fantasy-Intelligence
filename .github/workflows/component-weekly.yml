name: FIE Component Forecast and Weekly Evaluation

on:
  push:
    branches: ['research/component-*']
    paths:
      - '.github/workflows/component-weekly.yml'
      - 'research/component_weekly_*.py'
      - 'research/integrity_component_weekly_test.py'
      - 'research/component_diagnostics.py'
      - 'research/component_challenger.py'
      - 'research/component_refit_v3.py'
      - 'research/integrity_component_diagnostics_test.py'
      - 'config/component-diagnostics-v1.json'
      - 'config/component-challenger-contract-v1.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Replay/fixture work on research branches; live modes require main
        type: choice
        options: [replay, fixture, weekly, forecast, review, diagnostics]
        default: replay
      ablations:
        description: Generate stages 0-4 with the same captured inputs
        type: boolean
        default: true
      revise:
        description: Issue an additional pregame revision even if this week is frozen
        type: boolean
        default: false
  schedule:
    # Every 2 h from Tue 19:35 to Thu 11:35 Berlin. The runner gate admits Tue 19:00 - Thu 18:00
    # Berlin (late starts included); --check-work skips runs with nothing left to do.
    - cron: '35 19,21,23 * 9-12 2'
      timezone: Europe/Berlin
    - cron: '35 */2 * 9-12 3'
      timezone: Europe/Berlin
    - cron: '35 1-11/2 * 9-12 4'
      timezone: Europe/Berlin
    - cron: '35 19,21,23 1-11 1 2'
      timezone: Europe/Berlin
    - cron: '35 */2 1-11 1 3'
      timezone: Europe/Berlin
    - cron: '35 1-11/2 1-11 1 4'
      timezone: Europe/Berlin

permissions:
  contents: read

concurrency:
  group: fie-component-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'replay' || inputs.mode == 'fixture'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/component-recovered-20261016/research/requirements-recovery.txt
      - run: python -m pip install -r research/component-recovered-20261016/research/requirements-recovery.txt
      - name: Verify sealed recovery and operational adapter
        run: |
          python research/component-recovered-20261016/research/recovery_verify_delivery.py
          python -m unittest discover -s research -p integrity_component_weekly_test.py -v
          python -m unittest discover -s research -p integrity_component_diagnostics_test.py -v
          python -m unittest discover -s research/component-recovered-20261016/research -p integrity_recovery_test.py -v
      - name: Reproduce all 42 games and independently validate exact output
        if: github.event_name == 'push' || inputs.mode == 'replay'
        run: python research/component_weekly_ops.py --mode replay --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}-replay
      - name: Rebuild actuals and training; verify missing future outcomes stay pending
        run: python research/component_weekly_ops.py --mode fixture --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}-fixture
      - name: Verify separately versioned opponent-column repair
        run: |
          python research/component_refit_v3.py \
            --bundle data/research/components/2026-10-15/joint-v5/observations/observation-bundle.json \
            --training data/research/components/recovery-20261016/training/week05 \
            --through-week 5 \
            --output data/research/components/diagnostic-ci-v1/ci-repair-${{ github.run_id }}-${{ github.run_attempt }}/fit-v3.json
      - name: Upload replay, fixture, logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-recovery-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/component-recovered-20261016/data/research/components/operational-v1/2026/runs/ci-*
            research/component-recovered-20261016/data/research/components/diagnostic-ci-v1/
          if-no-files-found: warn
          retention-days: 90

  weekly:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'replay' && inputs.mode != 'fixture'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      RUN_ID: live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/component-recovered-20261016/research/requirements-recovery.txt
      - id: calendar
        name: Apply seasonal calendar and Berlin-time window
        run: python research/component_weekly_ops.py --check-due >> "$GITHUB_OUTPUT"
      - name: Restore previously published history (git only, no dependencies)
        if: steps.calendar.outputs.due == 'true'
        run: python research/component_weekly_history.py restore
      - id: work
        name: Skip scheduled runs with no work left (issued, captured and recaptured)
        if: steps.calendar.outputs.due == 'true'
        run: python research/component_weekly_ops.py --check-work >> "$GITHUB_OUTPUT"
      - if: steps.work.outputs.due == 'true'
        run: python -m pip install -r research/component-recovered-20261016/research/requirements-recovery.txt
      - name: Verify package and tests
        if: steps.work.outputs.due == 'true'
        run: |
          python research/component-recovered-20261016/research/recovery_verify_delivery.py
          python -m unittest discover -s research -p integrity_component_weekly_test.py -v
          python -m unittest discover -s research -p integrity_component_diagnostics_test.py -v
      - id: execute
        name: Capture actuals, review every freeze, and issue next pregame window
        if: steps.work.outputs.due == 'true'
        env:
          MODE: ${{ inputs.mode || 'weekly' }}
          ABLATIONS: ${{ github.event_name == 'schedule' || inputs.ablations }}
          REVISE: ${{ inputs.revise }}
        shell: bash
        run: |
          args=(--mode "$MODE" --run-id "$RUN_ID")
          [[ "$ABLATIONS" != 'true' ]] || args+=(--ablations)
          [[ "$REVISE" != 'true' ]] || args+=(--revise)
          python research/component_weekly_ops.py "${args[@]}"
      - name: Preserve sealed successful or failed run on evidence branch
        if: always() && steps.execute.outcome != 'skipped' && steps.execute.outcome != ''
        run: python research/component_weekly_history.py publish
      - name: Upload current run as an additional download route
        if: always() && steps.work.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: component-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/component-recovered-20261016/data/research/components/operational-v1/2026/runs/${{ env.RUN_ID }}
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize actual usability
        if: always()
        env:
          DUE: ${{ steps.work.outputs.due || 'false' }}
        run: |
          python research/component_weekly_summary.py --run-id "$RUN_ID" --due "$DUE" >> "$GITHUB_STEP_SUMMARY"
      - name: Emit workflow usability evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ALLOWED: ${{ steps.work.outputs.due || 'false' }}
          REASON: ${{ steps.work.outputs.reason || steps.calendar.outputs.reason || 'POLICY_NOT_DUE' }}
        run: |
          python research/workflow_usability.py emit \
            --workflow-path .github/workflows/component-weekly.yml \
            --workflow-name "FIE Component Forecast and Weekly Evaluation" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status "$JOB_STATUS" --adapter component-run \
            --policy-allowed "$ALLOWED" --policy-reason "$REASON" \
            --source-file "research/component-recovered-20261016/data/research/components/operational-v1/2026/runs/$RUN_ID/run-receipt.json"
      - name: Upload workflow usability evidence
        if: always() && hashFiles('.cache/fie-workflow-usability.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21

