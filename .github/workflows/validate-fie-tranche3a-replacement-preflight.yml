name: FIE Controlled Implementation — Tranche 3A Replacement Preflight

on:
  push:
    branches:
      - audit-implementation-2026-09
    paths:
      - ".github/workflows/validate-fie-tranche3a-replacement-preflight.yml"
      - "config/tranche3a-replacement-preflight.json"
      - "research/integrity_tranche3a_replacement_ownership.js"
      - "research/tranche3a_preflight.py"
      - "docs/audits/TRANCHE3A_REPLACEMENT_PREFLIGHT.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche3a-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Verify validated Tranche 2C ancestry
        run: git merge-base --is-ancestor 261bd8539b6ee91d2cfb5a8b6b586a7fdf3e33a0 HEAD

      - name: Preserve Tranche 2A, 2B and 2C targets
        run: |
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche1_six_format_runtime_characterization.js --mode target
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target
          python research/integrity_tranche2b_responsive_primary_actions.py
          python research/integrity_tranche2c_production_authority.py
          node research/integrity_decision_service_test.js

      - name: Reproduce frozen replacement gap
        run: |
          mkdir -p artifacts/tranche3a
          node research/integrity_tranche1_replacement_parity_characterization.js --mode baseline | tee artifacts/tranche3a/tranche1-replacement-baseline.log
          node research/integrity_tranche3a_replacement_ownership.js --mode baseline | tee artifacts/tranche3a/tranche3a-replacement-baseline.log

      - name: Keep later Tranche 3 gaps frozen
        run: |
          node research/integrity_tranche1_data_client_scope_characterization.js --mode baseline
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode baseline
          python research/integrity_tranche1_research_stage_identity.py --mode baseline

      - name: Capture exact 3A source bytes
        run: python research/tranche3a_preflight.py --output-dir artifacts/tranche3a/preflight-source

      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require deployable source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("config/release-gate.json").read_text())
          print("STATUS:",d.get("status"))
          if d.get("status")!="DEPLOYABLE_SOURCE":
              raise SystemExit(1)
          PY

      - name: Require preflight has no generated/runtime drift
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          lines=subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'],
              text=True
          ).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip()
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              if path == 'artifacts' or path.startswith('artifacts/'):
                  continue
              changed.append(path)
          if changed:
              print('Unexpected preflight drift:')
              for p in changed: print(' -',p)
              raise SystemExit(1)
          print('PASS Tranche 3A preflight did not alter tracked/generated/runtime tree')
          PY

      - name: Upload Tranche 3A preflight evidence and exact source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche3a-preflight-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/tranche3a/
            config/release-gate.json
