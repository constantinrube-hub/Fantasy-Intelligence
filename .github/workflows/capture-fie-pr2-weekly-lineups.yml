name: Capture FIE PR2 Weekly Lineup Evidence

on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season matching the already-refreshed current snapshots
        required: true
        default: '2026'
        type: string
      week:
        description: NFL regular-season week matching the already-refreshed current snapshots
        required: true
        type: string
      league_id:
        description: Optional single enabled Sleeper league ID
        required: false
        type: string
  schedule:
    # General three-hour poll reaches the first-game T-6 checkpoint despite
    # Thursday, Thanksgiving, Saturday, London and holiday schedule movement.
    - cron: '15 */3 * 8-12 *'
    - cron: '15 */3 1-11 1 *'
    # Sunday captures at T-4, after the 07:17 New York current refresh, while
    # the separate paired M10/Sleeper research checkpoint remains at T-6.
    - cron: '0,30 9-10 * 8-12 0'
      timezone: America/New_York
    # DOW stays unrestricted in January because restricted DOM+DOW uses OR.
    # The schedule resolver writes only when a Sunday-main checkpoint is due.
    - cron: '0,30 9-10 1-11 1 *'
      timezone: America/New_York

permissions:
  contents: write

concurrency:
  group: fie-pr2-weekly-lineups-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calendar:
    uses: ./.github/workflows/_fie-calendar-policy.yml
    with:
      purpose: weekly_lineups
  capture:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve automatic checkpoint
        id: capture_policy
        shell: bash
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          CALENDAR_SEASON: ${{ needs.calendar.outputs.season }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python research/capture_in_season_pr2_lineup_evidence.py \
              --season "$CALENDAR_SEASON" --schedule-check --github-output >> "$GITHUB_OUTPUT"
          else
            echo "capture_allowed=true" >> "$GITHUB_OUTPUT"
            echo "reason=EXPLICIT_MANUAL_CAPTURE" >> "$GITHUB_OUTPUT"
            echo "season=$INPUT_SEASON" >> "$GITHUB_OUTPUT"
            echo "week=$INPUT_WEEK" >> "$GITHUB_OUTPUT"
            echo "checkpoint_id=MANUAL" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize checkpoint decision
        env:
          ALLOWED: ${{ steps.capture_policy.outputs.capture_allowed }}
          REASON: ${{ steps.capture_policy.outputs.reason }}
          CHECKPOINT: ${{ steps.capture_policy.outputs.checkpoint_id }}
          SEASON: ${{ steps.capture_policy.outputs.season }}
          WEEK: ${{ steps.capture_policy.outputs.week }}
        run: echo "PR2 lineup capture allowed=$ALLOWED reason=$REASON checkpoint=$CHECKPOINT season=$SEASON week=$WEEK" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate exact lineup and capture contracts
        if: steps.capture_policy.outputs.capture_allowed == 'true'
        run: |
          python -m py_compile research/weekly_lineup_decision_support.py research/weekly_lineup_operational_evidence.py research/in_season_pr2_weekly_lineups.py research/capture_in_season_pr2_lineup_evidence.py
          python research/integrity_weekly_lineup_exact_solver_test.py
          python research/integrity_in_season_pr2_weekly_lineups_test.py
          python research/integrity_in_season_pr2_lineup_capture_test.py

      - name: Capture immutable provider evidence
        if: steps.capture_policy.outputs.capture_allowed == 'true'
        shell: bash
        env:
          INPUT_SEASON: ${{ steps.capture_policy.outputs.season }}
          INPUT_WEEK: ${{ steps.capture_policy.outputs.week }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_CHECKPOINT: ${{ steps.capture_policy.outputs.checkpoint_id }}
        run: |
          set -euo pipefail
          args=(--season "$INPUT_SEASON" --week "$INPUT_WEEK" --checkpoint-id "$INPUT_CHECKPOINT")
          if [ -n "${INPUT_LEAGUE_ID:-}" ]; then args+=(--league-scope "$INPUT_LEAGUE_ID"); fi
          python research/capture_in_season_pr2_lineup_evidence.py "${args[@]}"

      - name: Build captured lineup decision support
        if: steps.capture_policy.outputs.capture_allowed == 'true'
        shell: bash
        env:
          INPUT_SEASON: ${{ steps.capture_policy.outputs.season }}
          INPUT_WEEK: ${{ steps.capture_policy.outputs.week }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
        run: |
          set -euo pipefail
          evidence="data/research/evaluation/$INPUT_SEASON/weeks/week-$INPUT_WEEK/lineups/evidence/latest.json"
          args=(portfolio --season "$INPUT_SEASON" --week "$INPUT_WEEK" --evidence "$evidence" --output /tmp/fie-pr2-lineups.json --write-canonical-if-eligible)
          if [ -n "${INPUT_LEAGUE_ID:-}" ]; then args+=(--league-id "$INPUT_LEAGUE_ID"); fi
          python research/in_season_pr2_weekly_lineups.py "${args[@]}"

      - name: Commit only PR2 lineup research evidence
        if: steps.capture_policy.outputs.capture_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FIE Weekly Lineup Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/evaluation
          if git diff --cached --quiet; then
            echo "No PR2 weekly lineup evidence change"
            exit 0
          fi
          git commit -m "Capture FIE PR2 weekly lineup evidence"
          git fetch origin main
          git rebase origin/main
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Emit workflow usability evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CAPTURE_ALLOWED: ${{ steps.capture_policy.outputs.capture_allowed }}
          CAPTURE_REASON: ${{ steps.capture_policy.outputs.reason }}
        run: |
          python research/workflow_usability.py emit \
            --workflow-path .github/workflows/capture-fie-pr2-weekly-lineups.yml \
            --workflow-name "Capture FIE PR2 Weekly Lineup Evidence" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status "$JOB_STATUS" --adapter policy-commit --initial-sha "$GITHUB_SHA" \
            --policy-allowed "$CAPTURE_ALLOWED" --policy-reason "$CAPTURE_REASON"

      - name: Upload workflow usability evidence
        if: always() && hashFiles('.cache/fie-workflow-usability.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21
