name: FIE Controlled Implementation — Tranche 5B Research Lab Freshness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche5b-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify authorized preflight ancestry
        run: git merge-base --is-ancestor ed210c26dca1c0be4edb28b144b6859c366ac84d HEAD
      - name: Validate grouped Lab and shared freshness contract
        run: |
          node research/integrity_tranche5b_research_lab_freshness.js
          python research/integrity_tranche5b_research_lab_freshness.py --mode target
      - name: Preserve completed contracts
        run: |
          node research/integrity_tranche5a_semantic_ux.js
          python research/integrity_tranche5a_semantic_ux_rank_identity.py --mode target
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche3a_replacement_ownership.js --mode target
          node research/integrity_tranche3b_data_client_scope.js --mode target
          node research/integrity_tranche3c_player_identity.js --mode target
          node research/integrity_tranche3d_evidence_semantics.js
          python research/integrity_tranche3e_research_producer_typing.py
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target
          node research/integrity_tranche3a_all_league_replacement_profiles.js
      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal
      - name: Require deployable source
        run: python -c "import json; assert json.load(open('config/release-gate.json'))['status'] == 'DEPLOYABLE_SOURCE'"
      - name: Capture deterministic generated synchronization
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip().split(' -> ')[-1]
              if not (path == 'artifacts' or path.startswith('artifacts/')): changed.append(path)
          allowed={'config/build-manifest.json','config/release-gate.json','dist/config/build-manifest.json','dist/index.html','dist/app/core/research-lab-ux.js','dist/app/core/surface-router.js','dist/app/decision-ui.js','dist/app/research-report-ui.js','dist/app/runtime-foundation.js'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected: raise SystemExit('Unexpected source/generated drift:\n- '+'\n- '.join(unexpected))
          out=pathlib.Path('artifacts/tranche5b/generated-sync');out.mkdir(parents=True,exist_ok=True)
          for path in sorted(set(changed)&allowed):
              src=pathlib.Path(path)
              if src.exists():
                  dst=out/path;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          print('TRANCHE5B_TARGET_SYNC_REQUIRED:', ', '.join(sorted(changed)) if changed else 'none')
          PY
      - name: Upload Tranche 5B target evidence and deterministic sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche5b-target-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche5b/
            config/release-gate.json
            config/build-manifest.json
