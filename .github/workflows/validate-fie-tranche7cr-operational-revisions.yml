name: FIE Controlled Implementation — Tranche 7C-R3 Operational Revisions
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - name: Verify operational revision contract
        run: |
          python -m py_compile research/m10_prospective_operational_capture.py research/integrity_m10_operational_prospective_capture_test.py
          python research/integrity_m10_prospective_capture_test.py
          python research/integrity_m10_operational_prospective_capture_test.py
          python research/integrity_tranche7cr_season_lock.py --mode closure
          python research/integrity_tranche7c_operational_prospective_collection.py --mode closure
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/release_build.py --mode personal
      - run: python -c "import json; assert json.load(open('config/release-gate.json'))['status'] == 'DEPLOYABLE_SOURCE'"
      - name: Capture generated synchronization
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          changed=[line[3:].strip().split(' -> ')[-1] for line in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines() if not line[3:].strip().startswith('artifacts/')]
          allowed={'config/build-manifest.json','config/release-gate.json','dist/config/build-manifest.json'}; bad=sorted(set(changed)-allowed)
          if bad: raise SystemExit('Unexpected source/generated drift: '+', '.join(bad))
          out=pathlib.Path('artifacts/tranche7cr3/generated-sync');out.mkdir(parents=True,exist_ok=True)
          for path in sorted(set(changed)&allowed):
              src=pathlib.Path(path);dst=out/path;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fie-controlled-tranche7cr3-target-${{ github.sha }}
          path: artifacts/tranche7cr3/
          if-no-files-found: error
