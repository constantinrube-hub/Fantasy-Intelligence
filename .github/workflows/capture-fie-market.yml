name: Capture Immutable FIE Market Benchmark

on:
  workflow_dispatch:
    inputs:
      capture_window_hours:
        description: "Write first snapshot only this many hours before the week's first kickoff"
        required: false
        default: "18"
        type: string
  schedule:
    # Frequent enough to enter the 18-hour window before Thursday/Sunday first kickoffs.
    - cron: "41 */6 * 9-12,1 *"

permissions:
  contents: write

concurrency:
  group: fie-market-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify immutable archive contract
        run: python research/integrity_market_archive_test.py
      - name: Capture only inside verified regular-season pregame window
        env:
          WINDOW: ${{ inputs.capture_window_hours }}
        run: |
          python research/capture_sleeper_snapshot.py \
            --auto-pregame \
            --capture-window-hours "${WINDOW:-18}" \
            --output-root data/research/market/sleeper \
            --cache-dir .cache/fie-market
      - name: Verify archive after capture
        run: python research/production_readiness.py
      - name: Commit first-write market evidence
        run: |
          if git diff --quiet -- data/research/market/sleeper; then
            echo "No new benchmark snapshot in this run."
            exit 0
          fi
          git config user.name "FIE Market Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/market/sleeper
          git commit -m "Capture immutable Sleeper pregame benchmark"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
