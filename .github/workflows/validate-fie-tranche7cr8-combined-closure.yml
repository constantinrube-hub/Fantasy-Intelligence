name: FIE Controlled Implementation — Tranche 7C-R8 Combined Closure
on:
  push:
    branches: [audit-implementation-2026-09]
    paths:
      - 'config/tranche7cr8-combined-closure-target.json'
      - 'config/repository-lifecycle-contract.json'
      - '.github/workflows/validate-fie-tranche7cr8-combined-closure.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r research/requirements.txt
      - name: Verify closed R8 boundaries and controlled fixture path
        run: |
          mkdir -p artifacts/tranche7cr8-closure
          python research/integrity_tranche7cr8_operational_runner_design.py
          python research/integrity_tranche7cr8_corrected_lock.py --mode closure
          python research/integrity_m10_prospective_season_lock_v2_test.py
          python research/integrity_tranche7cr8b_weekly_producer.py --mode closure
          python research/integrity_tranche7cr8b_weekly_producer_target.py --mode closure
          python research/integrity_m10_prospective_weekly_producer_test.py
          python research/integrity_tranche7cr8c_workflow.py --mode closure
          python research/integrity_tranche7cr8c_workflow_target.py --mode closure
          python research/integrity_m10_prospective_r8c_workflow_test.py
          python research/integrity_m10_prospective_activation_guard_test.py
          python research/integrity_tranche7cr8_combined_closure.py --mode target
      - name: One deterministic personal release gate
        run: python tools/release_build.py --mode personal
      - name: Require deployable source
        run: python -c "import json; assert json.load(open('config/release-gate.json'))['status'] == 'DEPLOYABLE_SOURCE'"
      - name: Capture deterministic generated synchronization
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip().split(' -> ')[-1]
              if not (path == 'artifacts' or path.startswith('artifacts/')):
                  changed.append(path)
          allowed={'config/build-manifest.json','config/release-gate.json','dist/config/build-manifest.json'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
              raise SystemExit('Unexpected source/generated drift:\n- '+'\n- '.join(unexpected))
          out=pathlib.Path('artifacts/tranche7cr8-closure/generated-sync'); out.mkdir(parents=True,exist_ok=True)
          for path in sorted(set(changed)&allowed):
              src=pathlib.Path(path)
              if src.exists():
                  dst=out/path; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          print('R8_CLOSURE_SYNC_REQUIRED:', ', '.join(sorted(changed)) if changed else 'none')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fie-controlled-tranche7cr8-closure-${{ github.sha }}
          path: |
            artifacts/tranche7cr8-closure/
            config/release-gate.json
            config/build-manifest.json
          if-no-files-found: error
