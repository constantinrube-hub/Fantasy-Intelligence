name: FIE Controlled Implementation — Tranche 7C-R8C Workflow Preflight
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - name: Validate R8C workflow controls without provider access
        run: |
          mkdir -p artifacts/tranche7cr8c
          python research/integrity_tranche7cr8b_weekly_producer_target.py --mode closure
          python research/integrity_m10_prospective_r8c_workflow_test.py | tee artifacts/tranche7cr8c/r8c-fixture-validation.txt
          python research/integrity_tranche7cr8c_workflow.py | tee artifacts/tranche7cr8c/r8c-workflow-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fie-controlled-tranche7cr8c-preflight-${{ github.sha }}
          path: artifacts/tranche7cr8c/
          if-no-files-found: error
