name: Build FIE M9.1 Research Challenger

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Sleeper League ID"
        required: true
        default: "1391803939736801280"
        type: string
      season:
        description: "Season"
        required: true
        default: "2026"
        type: string
      adp_key:
        description: "Sleeper ADP key"
        required: true
        default: "adp_ppr"
        type: string

permissions:
  contents: read

concurrency:
  group: fie-m91-${{ inputs.league_id }}
  cancel-in-progress: false

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - run: pip install -r research/requirements.txt

      - name: Integrity test
        run: |
          python -m py_compile \
            research/build_m91_season_challenger.py \
            research/validate_m91_season_challenger.py
          python research/integrity_m91_transition_test.py

      - name: Rehydrate canonical derived cache
        shell: bash
        run: |
          set -euo pipefail
          LID="${{ inputs.league_id }}"
          SEASON="${{ inputs.season }}"
          LEAGUE="data/research/leagues/${LID}"
          CACHE=".cache/fie-research/leagues/${LID}"
          DERIVED="${CACHE}/derived"

          test -f "${LEAGUE}/milestone1.json"
          test -f "${LEAGUE}/milestone8.json"
          test -f "${LEAGUE}/milestone9.json"

          mkdir -p "${DERIVED}"

          python - "${LEAGUE}/milestone1.json" "${CACHE}/scoring_settings_rehydrate.json" <<'PY'
          import json, sys
          from pathlib import Path
          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          m1=json.loads(src.read_text())
          scoring=((m1.get("scoring") or {}).get("settings")
                   or m1.get("scoring_settings") or {})
          if not scoring:
              raise SystemExit("canonical M1 has no scoring settings")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(scoring,indent=2)+"\n")
          PY

          HIST_END="$((SEASON-1))"

          python research/fie_research.py \
            --seasons "2019-${HIST_END}" \
            --extended-seasons "2016-${HIST_END}" \
            --output "${CACHE}/milestone1_rehydrated.json" \
            --cache-dir "${CACHE}" \
            --derived-dir "${DERIVED}" \
            --league-id "${LID}" \
            --scoring-json "${CACHE}/scoring_settings_rehydrate.json"

          test -f "${DERIVED}/player_week.csv.gz"
          test -f "${DERIVED}/player_identity.csv.gz"

      - name: Rebuild M9 derived preseason profiles only
        shell: bash
        run: |
          set -euo pipefail
          LID="${{ inputs.league_id }}"
          SEASON="${{ inputs.season }}"
          LEAGUE="data/research/leagues/${LID}"
          CACHE=".cache/fie-research/leagues/${LID}"
          DERIVED="${CACHE}/derived"

          # M1-M8 are already canonical/committed. This resume path validates M7/M8
          # and regenerates M9 plus its derived latest-profile table from the
          # rehydrated player-week cache. It does not rebuild M1-M8.
          python research/build_performance_research.py \
            --league-id "${LID}" \
            --format AUTO \
            --season "${SEASON}" \
            --league-root "${LEAGUE}" \
            --derived-dir "${DERIVED}" \
            --cache-dir "${CACHE}" \
            --resume-from-m9

          PROFILE_PATH="$(python - "${LEAGUE}/milestone9.json" <<'PY'
          import json,sys
          from pathlib import Path
          m9=json.loads(Path(sys.argv[1]).read_text())
          print((m9.get("preseason_season_projection") or {}).get("latest_profiles_derived_table") or "")
          PY
          )"

          test -n "${PROFILE_PATH}"
          test -f "${PROFILE_PATH}"
          echo "Rehydrated M9 profile table: ${PROFILE_PATH}"

      - name: Build M9.1 challenger
        run: |
          python research/build_m91_season_challenger.py \
            --league-id "${{ inputs.league_id }}" \
            --season "${{ inputs.season }}" \
            --adp-key "${{ inputs.adp_key }}"

      - name: Validate M9.1 challenger
        run: |
          python research/validate_m91_season_challenger.py \
            --league-id "${{ inputs.league_id }}" \
            --season "${{ inputs.season }}"

      - name: Show focus players
        run: |
          cat "data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/m91_challenger/m91_focus_summary.json"

      - uses: actions/upload-artifact@v4
        with:
          name: fie-m91-challenger-${{ inputs.league_id }}-${{ inputs.season }}
          path: data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/m91_challenger
          retention-days: 14
