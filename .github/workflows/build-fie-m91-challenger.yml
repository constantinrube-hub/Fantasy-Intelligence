name: Build FIE M9.1 Research Challenger

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Sleeper League ID"
        required: true
        default: "1391803939736801280"
        type: string
      season:
        description: "Season"
        required: true
        default: "2026"
        type: string
      adp_key:
        description: "Sleeper ADP key"
        required: true
        default: "adp_ppr"
        type: string

permissions:
  contents: read

concurrency:
  group: fie-m91-${{ inputs.league_id }}
  cancel-in-progress: false

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt

      - name: Integrity test
        run: |
          python -m py_compile research/build_m91_season_challenger.py research/validate_m91_season_challenger.py
          python research/integrity_m91_transition_test.py

      - name: Build M9.1 challenger
        run: |
          python research/build_m91_season_challenger.py \
            --league-id "${{ inputs.league_id }}" \
            --season "${{ inputs.season }}" \
            --adp-key "${{ inputs.adp_key }}"

      - name: Validate M9.1 challenger
        run: |
          python research/validate_m91_season_challenger.py \
            --league-id "${{ inputs.league_id }}" \
            --season "${{ inputs.season }}"

      - name: Show focus players
        run: |
          cat "data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/m91_challenger/m91_focus_summary.json"

      - uses: actions/upload-artifact@v4
        with:
          name: fie-m91-challenger-${{ inputs.league_id }}-${{ inputs.season }}
          path: data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/m91_challenger
          retention-days: 14
