name: FIE Evidence Capture Reusable

on:
  workflow_call:
    inputs:
      capture_kind:
        required: true
        type: string
      automatic_capture:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fie-evidence-capture-${{ inputs.capture_kind }}
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check automatic waiver capture window
        id: capture_policy
        if: inputs.capture_kind == 'waiver' && inputs.automatic_capture
        run: python research/capture_fie_waivers.py --schedule-check >> "$GITHUB_OUTPUT"
      - name: Verify focused first-write contract
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        shell: bash
        run: |
          python research/integrity_window1a_evidence_backbone.py
          case "${{ inputs.capture_kind }}" in
            waiver)
              python research/integrity_waiver_capture_reconciliation_test.py
              python research/capture_fie_waivers.py --fixture --output-root /tmp/fie-waiver-fixture
              ;;
            weather) python research/capture_fie_weather.py --fixture --output-root /tmp/fie-weather-fixture ;;
            *) echo "Unsupported capture kind" >&2; exit 2 ;;
          esac
      - name: Capture immutable evidence
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        shell: bash
        run: |
          case "${{ inputs.capture_kind }}" in
            waiver)
              args=()
              if [ "${{ inputs.automatic_capture }}" = "true" ]; then args+=(--automatic); fi
              python research/capture_fie_waivers.py "${args[@]}" --output-index .cache/waiver-output.json
              python research/validate_window1a_evidence.py --kind waiver
              ;;
            weather)
              python research/capture_fie_weather.py
              python research/validate_window1a_evidence.py --kind weather
              ;;
          esac
      - name: Summarize this waiver invocation
        if: inputs.capture_kind == 'waiver' && steps.capture_policy.outputs.capture_allowed != 'false'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          index = json.loads(Path('.cache/waiver-output.json').read_text())
          audit = json.loads(Path(index['audit_path']).read_text())
          print('## Waiver capture observations')
          print('Rounds:', audit['requested_weeks'])
          print('Captured leagues:', audit.get('captured_league_count', audit['enabled_league_count']))
          print('Evidence status:', audit.get('invocation_status', 'UNKNOWN'))
          for rel in audit.get('reconciliation_paths', []):
              data=json.loads((Path('data/research/waivers/sleeper')/rel).read_text())
              print(f"- {data['league_id']}: {data['unique_transaction_count']} unique observed transactions; {data['source_failure_observation_count']} archived source-failure observations.")
          print('Only source-exposed claims are retained; private missing bids remain unknown.')
          PY
      - name: Commit only authorized research evidence
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        shell: bash
        run: |
          git config user.name "FIE Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          case "${{ inputs.capture_kind }}" in
            waiver) git add data/research/waivers/sleeper ;;
            weather) git add data/research/context/weather ;;
          esac
          if git diff --cached --quiet; then echo "No new immutable evidence"; exit 0; fi
          git commit -m "Capture FIE ${{ inputs.capture_kind }} evidence"
          git fetch origin main
          git rebase origin/main
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Emit workflow usability evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CAPTURE_ALLOWED: ${{ steps.capture_policy.outputs.capture_allowed }}
        shell: bash
        run: |
          if [ "${{ inputs.capture_kind }}" = "waiver" ]; then
            path=.github/workflows/capture-fie-waiver-evidence.yml
            name="Capture FIE Waiver Evidence"
            adapter=waiver-index
          else
            path=.github/workflows/capture-fie-weather-evidence.yml
            name="Capture FIE Pregame Weather Evidence"
            adapter=commit
          fi
          python research/workflow_usability.py emit \
            --workflow-path "$path" --workflow-name "$name" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status "$JOB_STATUS" --adapter "$adapter" \
            --source-file .cache/waiver-output.json \
            --policy-allowed "$CAPTURE_ALLOWED" --initial-sha "$GITHUB_SHA"

      - name: Upload workflow usability evidence
        if: always() && hashFiles('.cache/fie-workflow-usability.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21
