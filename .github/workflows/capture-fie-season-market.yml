name: Capture Daily FIE Sleeper Season Projections / ADP

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: false
        default: ""
        type: string
  schedule:
    # Prospective preseason evidence. Daily capture matters because old ADP cannot be reconstructed cleanly later.
    - cron: "17 11 * 4-9 *"

permissions:
  contents: write
concurrency:
  group: fie-season-market-daily
  cancel-in-progress: false

jobs:
  calendar:
    uses: ./.github/workflows/_fie-calendar-policy.yml
    with:
      purpose: season_market
  capture:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - run: pip install -r research/requirements.txt
      - name: Resolve season and capture immutable daily market
        env:
          INPUT_SEASON: ${{ inputs.season }}
          CALENDAR_SEASON: ${{ needs.calendar.outputs.season }}
        shell: bash
        run: |
          SEASON="${INPUT_SEASON:-$CALENDAR_SEASON}"
          [[ "$SEASON" =~ ^20[0-9]{2}$ ]] || { echo "Invalid season" >&2; exit 2; }
          python research/capture_sleeper_season_market.py --season "$SEASON" --output-root data/research/market/sleeper
          python research/build_fie_point_in_time_evidence_report.py
          python research/validate_fie_point_in_time_evidence_report.py --verify-deterministic
          echo "FIE_SEASON=$SEASON" >> "$GITHUB_ENV"
      - name: Commit first-write snapshot
        run: |
          git config user.name "FIE Market Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/research/market/sleeper/$FIE_SEASON" data/research/portfolio/2026/point-in-time-evidence-report.json || true
          if git diff --cached --quiet; then echo "Today's immutable snapshot already exists"; exit 0; fi
          git commit -m "Capture FIE daily season market $FIE_SEASON"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Emit workflow usability evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python research/workflow_usability.py emit \
            --workflow-path .github/workflows/capture-fie-season-market.yml \
            --workflow-name "Capture Daily FIE Sleeper Season Projections / ADP" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status "$JOB_STATUS" --adapter commit --initial-sha "$GITHUB_SHA"

      - name: Upload workflow usability evidence
        if: always() && hashFiles('.cache/fie-workflow-usability.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21
