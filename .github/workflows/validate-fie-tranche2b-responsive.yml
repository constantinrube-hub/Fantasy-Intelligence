name: FIE Controlled Implementation — Tranche 2B Responsive Correctness

on:
  push:
    branches:
      - audit-implementation-2026-09
    paths:
      - "app/decision-ui.css"
      - "dist/app/decision-ui.css"
      - "research/integrity_tranche1_responsive_decision_visibility.py"
      - "research/integrity_tranche2b_responsive_primary_actions.py"
      - "config/tranche2b-responsive.json"
      - "config/build-manifest.json"
      - "dist/config/build-manifest.json"
      - "docs/audits/TRANCHE2B_RESPONSIVE_CORRECTION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche2b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Verify validated Tranche 2A ancestry
        run: git merge-base --is-ancestor 7533ce190a8732b4447d2e14c489153db05b8746 HEAD

      - name: Preserve Tranche 2A six-format target
        run: |
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche1_six_format_runtime_characterization.js --mode target
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target

      - name: Responsive primary-action target
        run: python research/integrity_tranche2b_responsive_primary_actions.py

      - name: Keep unrelated Tranche 1 gaps frozen
        run: |
          node research/integrity_tranche1_replacement_parity_characterization.js --mode baseline
          node research/integrity_tranche1_data_client_scope_characterization.js --mode baseline
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode baseline
          python research/integrity_tranche1_research_stage_identity.py --mode baseline

      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require deployable source
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path("config/release-gate.json").read_text())
          print("STATUS:",d.get("status"))
          if d.get("status")!="DEPLOYABLE_SOURCE":
              raise SystemExit(1)
          PY2

      - name: Require no generated drift except deterministic manifest sync
        shell: bash
        run: |
          python - <<'PY2'
          import subprocess, pathlib, shutil
          lines=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip()
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              changed.append(path)
          allowed={'config/build-manifest.json','dist/config/build-manifest.json'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
              print('Unexpected generated/source drift:')
              for p in unexpected: print(' -',p)
              raise SystemExit(1)
          out=pathlib.Path('artifacts/tranche2b/generated-sync')
          out.mkdir(parents=True,exist_ok=True)
          for p in sorted(set(changed)&allowed):
              dest=out/p
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dest)
          if changed:
              print('MANIFEST_SYNC_REQUIRED:', ', '.join(sorted(changed)))
          else:
              print('PASS generated tree fully synchronized')
          PY2

      - name: Upload Tranche 2B evidence and deterministic manifest sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche2b-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche2b/
            config/release-gate.json
            config/build-manifest.json
