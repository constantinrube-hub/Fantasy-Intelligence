name: FIE Controlled Implementation — Tranche 7C-R8B Weekly Producer Target
on:
  push:
    branches: [audit-implementation-2026-09]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - name: Build and validate controlled R8B fixture capture
        run: |
          mkdir -p artifacts/tranche7cr8b
          python research/integrity_tranche7cr8b_weekly_producer.py --mode closure
          python research/integrity_m10_prospective_weekly_producer_test.py
          python research/build_m10_prospective_weekly_capture.py --fixture --output-root artifacts/tranche7cr8b/capture
          python research/integrity_tranche7cr8b_weekly_producer_target.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fie-controlled-tranche7cr8b-target-${{ github.sha }}
          path: artifacts/tranche7cr8b/
          if-no-files-found: error
