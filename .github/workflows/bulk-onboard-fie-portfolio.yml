name: Bulk Onboard FIE Portfolio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "PLAN_ONLY makes no changes. REGISTER_ONLY refreshes central portfolio status only. BUILD_MISSING builds required League-ID research. FULL also refreshes current snapshots."
        required: true
        default: PLAN_ONLY
        type: choice
        options: [PLAN_ONLY, REGISTER_ONLY, BUILD_MISSING, FULL]
      priority_cutoff:
        description: "Build this priority and higher. ALL includes every managed league."
        required: true
        default: ALL
        type: choice
        options: [VERY_HIGH, HIGH, MEDIUM, LOW, ALL]
      max_parallel:
        description: "Maximum simultaneous historical research builds"
        required: true
        default: "4"
        type: choice
        options: [1, 2, 3, 4, 5, 6]
      refresh_current:
        description: "Refresh current snapshots after successful merge. FULL always refreshes."
        required: true
        default: true
        type: boolean
      full_raw_cache:
        description: "Also cache the broader Step 1 raw archive inside each build job"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FIE_PORTFOLIO_CONFIG: config/league-portfolio.json

concurrency:
  group: fie-bulk-portfolio
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      error_count: ${{ steps.plan.outputs.error_count }}
      managed_count: ${{ steps.plan.outputs.managed_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portfolio configuration and custom rules
        run: |
          python research/integrity_custom_league_rules_test.py
          python research/integrity_bulk_onboarding_test.py --config-only
      - name: Resolve Sleeper portfolio and build plan
        id: plan
        run: |
          python research/bulk_onboard.py plan \
            --config "$FIE_PORTFOLIO_CONFIG" \
            --registry data/research/leagues/registry.json \
            --priority-cutoff "${{ inputs.priority_cutoff }}" \
            --output /tmp/fie-bulk-plan.json \
            --summary /tmp/fie-bulk-plan.md
          cat /tmp/fie-bulk-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable plan for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: fie-bulk-plan
          path: /tmp/fie-bulk-plan.json
          retention-days: 7

  build:
    needs: plan
    if: ${{ (inputs.mode == 'BUILD_MISSING' || inputs.mode == 'FULL') && needs.plan.outputs.has_builds == 'true' }}
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Build isolated League-ID M1-M6 bundle
        env:
          LID: ${{ matrix.league_id }}
          LFMT: ${{ matrix.format }}
          FULL_RAW: ${{ inputs.full_raw_cache }}
        shell: bash
        run: |
          rm -rf "data/research/leagues/$LID"
          ARGS="--league-id $LID --format $LFMT --portfolio-config $FIE_PORTFOLIO_CONFIG --registry /tmp/fie-registry-$LID.json"
          if [ "$FULL_RAW" = "true" ]; then ARGS="$ARGS --full-raw-cache"; fi
          python research/build_league_research.py $ARGS
      - name: Upload successful League-ID artifact
        uses: actions/upload-artifact@v4
        with:
          name: fie-league-${{ matrix.league_id }}
          path: data/research/leagues/${{ matrix.league_id }}
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [plan, build]
    if: ${{ always() && inputs.mode != 'PLAN_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Download resolved portfolio plan
        uses: actions/download-artifact@v4
        with:
          name: fie-bulk-plan
          path: /tmp/fie-plan
      - name: Download successful parallel league builds
        if: ${{ needs.plan.outputs.has_builds == 'true' && (inputs.mode == 'BUILD_MISSING' || inputs.mode == 'FULL') }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fie-league-*
          path: /tmp/fie-artifacts
      - name: Merge successful League-ID artifacts without touching failures
        if: ${{ needs.plan.outputs.has_builds == 'true' && (inputs.mode == 'BUILD_MISSING' || inputs.mode == 'FULL') }}
        shell: bash
        run: |
          if [ -d /tmp/fie-artifacts ]; then
            for d in /tmp/fie-artifacts/fie-league-*; do
              [ -d "$d" ] || continue
              LID="${d##*fie-league-}"
              if ! [[ "$LID" =~ ^[0-9]{6,32}$ ]]; then continue; fi
              mkdir -p "data/research/leagues/$LID"
              # Historical/profile files from the successful artifact overwrite only
              # that League ID. Existing current/operator files survive until refresh.
              cp -a "$d"/. "data/research/leagues/$LID/"
              echo "Merged successful league $LID"
            done
          fi
      - name: Rebuild generated registry and portfolio status
        run: |
          python research/rebuild_league_registry.py \
            --config "$FIE_PORTFOLIO_CONFIG" \
            --plan /tmp/fie-plan/fie-bulk-plan.json
      - name: Validate all merged League-ID namespaces
        run: |
          python research/integrity_multileague_test.py
          python research/integrity_custom_league_rules_test.py
          python research/integrity_bulk_onboarding_test.py --config-only
          python - <<'PY'
          import json, subprocess
          reg=json.load(open('data/research/leagues/registry.json'))
          validators={1:'validate_bundle.py',2:'validate_m2_bundle.py',3:'validate_m3_bundle.py',4:'validate_m4_bundle.py',5:'validate_m5_bundle.py',6:'validate_m6_bundle.py'}
          for lid in sorted((reg.get('leagues') or {})):
              root=f'data/research/leagues/{lid}'
              for n,v in validators.items():
                  subprocess.run(['python',f'research/{v}',f'{root}/milestone{n}.json'],check=True)
          PY
      - name: Refresh every research-ready managed league
        if: ${{ inputs.mode == 'FULL' || (inputs.mode == 'BUILD_MISSING' && inputs.refresh_current == true) }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/fie_refresh_ids.txt
          import json
          reg=json.load(open('data/research/leagues/registry.json'))
          for lid,row in sorted((reg.get('leagues') or {}).items()):
              if row.get('enabled',True) and row.get('current_refresh',True): print(lid)
          PY
          : > /tmp/fie_built_current_ids.txt
          while read -r LID; do
            [ -n "$LID" ] || continue
            ROOT="data/research/leagues/$LID"
            echo "=== Current refresh $LID ==="
            if ! python research/validate_m4_bundle.py "$ROOT/milestone4.json" \
              || ! python research/validate_m5_bundle.py "$ROOT/milestone5.json" \
              || ! python research/validate_m6_bundle.py "$ROOT/milestone6.json"; then
              echo "Skipping invalid historical bundle for $LID" >&2
              continue
            fi
            if ! python research/build_current_snapshot.py \
              --league-id "$LID" \
              --league-profile "$ROOT/profile.json" \
              --m4-bundle "$ROOT/milestone4.json" \
              --m5-bundle "$ROOT/milestone5.json" \
              --m6-bundle "$ROOT/milestone6.json" \
              --cache-dir ".cache/fie-current/leagues/$LID" \
              --sleeper-archive data/research/market/sleeper \
              --output "$ROOT/current/milestone5_current.json"; then
              echo "Current build failed for $LID; preserving any previous snapshot." >&2
              continue
            fi
            echo "$LID" >> /tmp/fie_built_current_ids.txt
          done < /tmp/fie_refresh_ids.txt
          python research/deduplicate_current_snapshots.py
          python - <<'PY' > /tmp/fie_governance_ids.txt
          import json
          from pathlib import Path
          reg=json.load(open('data/research/leagues/registry.json'))
          for lid in sorted((reg.get('leagues') or {})):
              if (Path('data/research/leagues')/lid/'current/milestone5_current.json').exists(): print(lid)
          PY
          while read -r LID; do
            [ -n "$LID" ] || continue
            ROOT="data/research/leagues/$LID"
            if grep -qx "$LID" /tmp/fie_built_current_ids.txt; then EXTRA="--mode AUTO --persist-mode"; else EXTRA=""; fi
            python research/fie_governance.py \
              --league-id "$LID" \
              --league-profile "$ROOT/profile.json" \
              --m4-bundle "$ROOT/milestone4.json" \
              --m5-bundle "$ROOT/milestone5.json" \
              --m6-bundle "$ROOT/milestone6.json" \
              --current-snapshot "$ROOT/current/milestone5_current.json" \
              --operator-override "$ROOT/governance/operator_override.json" \
              --global-operator-override data/research/governance/operator_override.json \
              --output "$ROOT/governance/active_release.json" $EXTRA
          done < /tmp/fie_governance_ids.txt
          python research/integrity_current_storage_test.py
          python research/rebuild_league_registry.py \
            --config "$FIE_PORTFOLIO_CONFIG" \
            --plan /tmp/fie-plan/fie-bulk-plan.json
      - name: Final production audit
        run: |
          python research/production_readiness.py
          python research/integrity_portfolio_home_test.py
          python research/integrity_decision_engines_test.py
          python research/integrity_draft_rank_sort_test.py
      - name: Portfolio result summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open('data/research/leagues/portfolio-status.json'))
          rows=p.get('leagues') or {}
          counts={}
          for r in rows.values(): counts[r.get('status','UNKNOWN')]=counts.get(r.get('status','UNKNOWN'),0)+1
          print('\n# Bulk Portfolio Result\n')
          print(f"Managed leagues: **{len(rows)}**  ")
          print(' · '.join(f"**{k}** {v}" for k,v in sorted(counts.items())))
          print('\n| League | Priority | Format | Research state |\n|---|---|---|---|')
          for lid,r in sorted(rows.items(), key=lambda kv: ({'VERY_HIGH':-4,'HIGH':-3,'MEDIUM':-2,'LOW':-1}.get(kv[1].get('priority'),0), kv[0])):
              print(f"| {r.get('league_name') or lid} `{lid}` | {str(r.get('priority')).replace('_',' ')} | {r.get('format')} | **{r.get('status')}** |")
          PY
      - name: Commit successful portfolio changes once
        run: |
          if git diff --quiet -- data/research/leagues data/research/shared data/research/market/sleeper; then
            echo "No generated portfolio artifacts changed."
            exit 0
          fi
          git config user.name "FIE Portfolio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/leagues data/research/shared data/research/market/sleeper
          git commit -m "Bulk onboard FIE league portfolio"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
