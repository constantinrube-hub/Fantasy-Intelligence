name: Migrate Existing FIE Profile to League Namespace

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Legacy League ID. Default is inferred from the current M1 provenance in this repository."
        required: false
        default: "1313697754907697152"
        type: string
      league_format:
        description: "Format of the existing historical profile"
        required: true
        default: "REDRAFT"
        type: choice
        options: [REDRAFT, DYNASTY, CHOPPED, REDRAFT_BESTBALL, DYNASTY_BESTBALL, AUTO]

permissions:
  contents: write

concurrency:
  group: fie-profile-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve legacy League ID from M1 provenance
        env:
          INPUT_LID: ${{ inputs.league_id }}
        run: |
          LEGACY_ID=$(python - <<'PY'
          import json,os
          d=json.load(open('data/research/milestone1.json'))
          embedded=str(((d.get('scoring') or {}).get('provenance') or {}).get('league_id') or '')
          supplied=str(os.environ.get('INPUT_LID') or '').strip()
          lid=supplied or embedded
          if not lid.isdigit(): raise SystemExit('No valid legacy League ID')
          if embedded and lid!=embedded: raise SystemExit(f'M1 provenance belongs to {embedded}, not {lid}')
          print(lid)
          PY
          )
          echo "FIE_LEAGUE_ID=$LEGACY_ID" >> "$GITHUB_ENV"
          echo "FIE_LEAGUE_ROOT=data/research/leagues/$LEGACY_ID" >> "$GITHUB_ENV"
      - name: Build migration profile from exact historical M1 scoring
        env:
          LFMT: ${{ inputs.league_format }}
        run: |
          python research/league_profile.py legacy \
            --league-id "$FIE_LEAGUE_ID" \
            --format "$LFMT" \
            --m1-bundle data/research/milestone1.json \
            --output /tmp/profile.json \
            --registry data/research/leagues/registry.json
      - name: Non-destructively copy existing generated research
        run: |
          python research/migrate_legacy_profile.py \
            --league-id "$FIE_LEAGUE_ID" \
            --profile /tmp/profile.json
          python research/validate_bundle.py "$FIE_LEAGUE_ROOT/milestone1.json"
          python research/validate_m4_bundle.py "$FIE_LEAGUE_ROOT/milestone4.json"
          python research/validate_m5_bundle.py "$FIE_LEAGUE_ROOT/milestone5.json"
          python research/validate_m6_bundle.py "$FIE_LEAGUE_ROOT/milestone6.json"
      - name: Rebuild namespaced governance against migrated artifacts
        run: |
          python research/fie_governance.py \
            --league-id "$FIE_LEAGUE_ID" \
            --league-profile "$FIE_LEAGUE_ROOT/profile.json" \
            --m4-bundle "$FIE_LEAGUE_ROOT/milestone4.json" \
            --m5-bundle "$FIE_LEAGUE_ROOT/milestone5.json" \
            --m6-bundle "$FIE_LEAGUE_ROOT/milestone6.json" \
            --current-snapshot "$FIE_LEAGUE_ROOT/current/milestone5_current.json" \
            --operator-override "$FIE_LEAGUE_ROOT/governance/operator_override.json" \
            --global-operator-override data/research/governance/operator_override.json \
            --output "$FIE_LEAGUE_ROOT/governance/active_release.json"
      - name: Audit migrated namespace
        run: python research/production_readiness.py --league-id "$FIE_LEAGUE_ID"
      - name: Prove legacy files are unchanged
        run: |
          if ! git diff --quiet -- data/research/milestone1.json data/research/milestone2.json data/research/milestone3.json data/research/milestone4.json data/research/milestone5.json data/research/milestone6.json data/research/current data/research/governance; then
            echo "ERROR: migration touched the source legacy profile" >&2
            exit 1
          fi
      - name: Commit migrated league namespace
        run: |
          if git diff --quiet -- "$FIE_LEAGUE_ROOT" data/research/leagues/registry.json; then
            echo "Already migrated; nothing changed."
            exit 0
          fi
          git config user.name "FIE Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FIE_LEAGUE_ROOT" data/research/leagues/registry.json
          git commit -m "Preserve FIE research profile for league $FIE_LEAGUE_ID"
          git push
