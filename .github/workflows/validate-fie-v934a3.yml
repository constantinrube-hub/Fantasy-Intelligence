name: Validate FIE V9.3.4A3

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/current-snapshot-store.js'
      - 'app/v9.3.4a2-performance-hotfix.js'
      - 'app/v9.3.4a3-score-performance.js'
      - 'functions/api/data/nflverse/contracts.js'
      - 'research/integrity_v934a3_test.py'
      - '.github/workflows/validate-fie-v934a3.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app/current-snapshot-store.js
          node --check app/v9.3.4a2-performance-hotfix.js
          node --check app/v9.3.4a3-score-performance.js
      - name: V9.3.4A3 integrity
        run: python research/integrity_v934a3_test.py
