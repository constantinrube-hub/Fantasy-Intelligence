name: Rebuild FIE Deploy Dist

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fie-deploy-dist
  cancel-in-progress: true

jobs:
  rebuild-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Build deterministic personal deployment and run full gate
        run: python tools/release_build.py --mode personal
      - name: Verify release gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/release-gate.json')
          if not p.exists(): raise SystemExit('release-gate.json missing')
          d=json.loads(p.read_text())
          print('STATUS:',d.get('status'))
          if d.get('status')!='DEPLOYABLE_SOURCE': raise SystemExit(1)
          PY
      - name: Commit synchronized deploy artifacts
        run: |
          TRACKED=(
            app/generated/model-config.js
            app/generated/release.js
            app/generated/runtime-contracts.js
            functions/release.js
            config/build-manifest.json
            config/model-config.json
            config/release.json
            config/release-gate.json
            dist
          )
          if git diff --quiet -- "${TRACKED[@]}" && [ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]; then
            echo "Deploy tree already synchronized."
            exit 0
          fi
          git config user.name "FIE Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- "${TRACKED[@]}"
          git commit -m "Rebuild FIE V9.3.2 deploy dist"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
