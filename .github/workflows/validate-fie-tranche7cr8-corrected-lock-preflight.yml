name: FIE Controlled Implementation — Tranche 7C-R8A Corrected Lock Preflight
on:
  push:
    branches: [audit-implementation-2026-09]
    paths:
      - 'config/m10-prospective-*-contract.json'
      - 'config/m10-prospective-operational-runner-design.json'
      - 'config/tranche7cr8-corrected-lock-preflight.json'
      - 'config/repository-lifecycle-contract.json'
      - 'research/m10_prospective_features.py'
      - 'research/m10_prospective_season_lock.py'
      - 'research/m10_prospective_season_lock_v2.py'
      - 'research/build_m10_prospective_*v2.py'
      - 'research/validate_m10_prospective_season_lock_v2.py'
      - 'research/integrity_m10_prospective_*v2_test.py'
      - 'research/integrity_tranche7cr8_*.py'
      - 'research/m10_prospective_activation_guard.py'
      - 'research/integrity_m10_prospective_activation_guard_test.py'
      - '.github/workflows/validate-fie-tranche7cr8-corrected-lock-preflight.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - name: Validate corrected shared features and portable v2 lock
        run: |
          python research/integrity_tranche7cr8_operational_runner_design.py
          python research/integrity_tranche7cr8_corrected_lock.py --mode target
          python research/integrity_m10_prospective_features_v2_test.py
          python research/integrity_m10_prospective_season_lock_v2_test.py
          python research/integrity_m10_prospective_activation_guard_test.py
