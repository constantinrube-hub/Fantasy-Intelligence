name: FIE Controlled Implementation — Tranche 7C-R4 Decision Traces
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - name: Verify research-only decision trace contract
        shell: bash
        run: |
          mkdir -p artifacts/tranche7cr4
          python -m py_compile research/m10_prospective_decision_traces.py research/integrity_m10_prospective_decision_traces_test.py
          python research/integrity_m10_prospective_decision_traces_test.py | tee artifacts/tranche7cr4/decision-trace-validation.txt
          python research/integrity_tranche5c_documentation_lifecycle.py --mode target | tee artifacts/tranche7cr4/lifecycle-validation.txt
      - name: Capture R4 validation evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          pathlib.Path('artifacts/tranche7cr4/metadata.json').write_text(json.dumps({
              'scope':'research_only',
              'production_model':'M9',
              'production_activation':False,
              'runtime_integration':False,
              'app_integration':False,
          }, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fie-controlled-tranche7cr4-target-${{ github.sha }}
          path: artifacts/tranche7cr4/
          if-no-files-found: error
