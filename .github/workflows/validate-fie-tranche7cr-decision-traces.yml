name: FIE Controlled Implementation — Tranche 7C-R4 Decision Traces
on:
  push:
    branches: [audit-implementation-2026-09]
    paths:
      - 'research/m10_prospective_decision_traces.py'
      - 'research/integrity_m10_prospective_decision_traces_test.py'
      - '.github/workflows/validate-fie-tranche7cr-decision-traces.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - run: python research/integrity_m10_prospective_decision_traces_test.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python tools/release_build.py --mode personal
