name: FIE Audit Release Gate — Tranche 5E Regression Closure

on:
  workflow_dispatch:
  push:
    branches: [audit-implementation-2026-09]
    paths:
      - 'config/tranche5e-regression-closure-target.json'

permissions:
  contents: read

concurrency:
  group: fie-tranche5e-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify green-preflight authorization and manual controlled lifecycle
        run: |
          python research/integrity_tranche5e_regression_closure.py --mode target
          python research/integrity_tranche5d_documentation_cleanup.py --mode target
          python research/integrity_tranche5c_documentation_lifecycle.py --mode target
      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal
      - name: Require deployable source
        run: python -c "import json; assert json.load(open('config/release-gate.json'))['status'] == 'DEPLOYABLE_SOURCE'"
      - name: Capture deterministic generated synchronization
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip().split(' -> ')[-1]
              if not (path == 'artifacts' or path.startswith('artifacts/')):
                  changed.append(path)
          allowed={'config/build-manifest.json','config/release-gate.json','dist/config/build-manifest.json'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
              raise SystemExit('Unexpected source/generated drift:\n- '+'\n- '.join(unexpected))
          out=pathlib.Path('artifacts/tranche5e/generated-sync')
          out.mkdir(parents=True,exist_ok=True)
          for path in sorted(set(changed)&allowed):
              src=pathlib.Path(path)
              if src.exists():
                  dst=out/path
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(src,dst)
          print('TRANCHE5E_TARGET_SYNC_REQUIRED:', ', '.join(sorted(changed)) if changed else 'none')
          PY
      - name: Upload Tranche 5E target evidence and deterministic sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche5e-target-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche5e/
            config/release-gate.json
            config/build-manifest.json
