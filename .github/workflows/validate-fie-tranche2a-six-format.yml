name: FIE Controlled Implementation — Tranche 2A Six-Format

on:
  push:
    branches:
      - audit-implementation-2026-09
    paths:
      - "config/contracts/runtime-contracts.json"
      - "app/generated/runtime-contracts.js"
      - "research/generated_runtime_contracts.py"
      - "app/core/core-services.js"
      - "app/runtime-foundation.js"
      - "app/league-context.js"
      - "app/core/draft-value-service.js"
      - "app/core/value-calibration-guard.js"
      - "app/decision-engines.js"
      - "app/draft-monte-carlo-worker.js"
      - "app/dst-intelligence.js"
      - "research/integrity_tranche1_six_format_runtime_characterization.js"
      - "research/integrity_tranche1_all_league_runtime_profiles.js"
      - "research/integrity_tranche2a_six_format_contract.js"
      - "config/tranche2a-six-format.json"
      - ".github/workflows/validate-fie-tranche2a-six-format.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Verify Tranche 1 baseline ancestry
        run: |
          git merge-base --is-ancestor \
            309aebf047ee2f250d8a7612aedb0bf6ff5c4455 \
            HEAD

      - name: Detect preflight vs corrected source
        id: phase
        shell: bash
        run: |
          if [ -f config/tranche2a-six-format.json ]; then
            echo "mode=target" >> "$GITHUB_OUTPUT"
          else
            echo "mode=preflight" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — prove Tranche 1 behavioral baseline still stable
        if: steps.phase.outputs.mode == 'preflight'
        run: |
          node research/integrity_tranche1_six_format_runtime_characterization.js --mode baseline
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode baseline
          node research/integrity_tranche1_replacement_parity_characterization.js --mode baseline
          node research/integrity_tranche1_data_client_scope_characterization.js --mode baseline
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode baseline
          python research/integrity_tranche1_research_stage_identity.py --mode baseline
          python research/integrity_tranche1_responsive_decision_visibility.py --mode baseline

      - name: Preflight — capture exact 2A source inputs
        if: steps.phase.outputs.mode == 'preflight'
        uses: actions/upload-artifact@v4
        with:
          name: fie-tranche2a-prechange-source-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            index.html
            config/contracts/runtime-contracts.json
            research/generate_runtime_contracts.py
            app/generated/runtime-contracts.js
            research/generated_runtime_contracts.py
            app/core/core-services.js
            app/runtime-foundation.js
            app/league-context.js
            app/core/draft-value-service.js
            app/core/value-calibration-guard.js
            app/decision-engines.js
            app/draft-monte-carlo-worker.js
            app/dst-intelligence.js
            app/decision-model-v9.js
            research/integrity_tranche1_six_format_runtime_characterization.js
            research/integrity_tranche1_all_league_runtime_profiles.js
            research/integrity_tranche1_replacement_parity_characterization.js
            research/integrity_tranche1_data_client_scope_characterization.js
            research/integrity_tranche1_direct_fetch_allowlist.py
            research/integrity_tranche1_research_stage_identity.py
            research/integrity_tranche1_responsive_decision_visibility.py
            research/tranche1_characterization.py
            config/build-manifest.json
            config/release.json
            config/model-config.json

      - name: Target — generate runtime contracts
        if: steps.phase.outputs.mode == 'target'
        run: python research/generate_runtime_contracts.py

      - name: Target — six-format contract
        if: steps.phase.outputs.mode == 'target'
        run: node research/integrity_tranche2a_six_format_contract.js

      - name: Target — hybrid runtime semantics
        if: steps.phase.outputs.mode == 'target'
        run: |
          node research/integrity_tranche1_six_format_runtime_characterization.js \
            --mode target

      - name: Target — all 22 real profile semantics
        if: steps.phase.outputs.mode == 'target'
        run: |
          node research/integrity_tranche1_all_league_runtime_profiles.js \
            --mode target

      - name: Target — keep unrelated Tranche 1 findings frozen
        if: steps.phase.outputs.mode == 'target'
        run: |
          node research/integrity_tranche1_replacement_parity_characterization.js --mode baseline
          node research/integrity_tranche1_data_client_scope_characterization.js --mode baseline
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode baseline
          python research/integrity_tranche1_research_stage_identity.py --mode baseline
          python research/integrity_tranche1_responsive_decision_visibility.py --mode baseline

      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require deployable source and synchronized dist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("config/release-gate.json").read_text())
          print("STATUS:",d.get("status"))
          if d.get("status")!="DEPLOYABLE_SOURCE":
              raise SystemExit(1)
          PY
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::Tranche 2A changed deterministic dist without committed parity."
            git status --short -- dist
            exit 1
          fi

      - name: Target — require generated contract files committed
        if: steps.phase.outputs.mode == 'target'
        run: |
          if [ -n "$(git status --porcelain -- app/generated/runtime-contracts.js research/generated_runtime_contracts.py)" ]; then
            echo "::error::Generated runtime contract outputs are not committed."
            git status --short -- app/generated/runtime-contracts.js research/generated_runtime_contracts.py
            exit 1
          fi

      - name: Upload 2A validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche2a-${{ steps.phase.outputs.mode }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche2a-preflight/
            config/release-gate.json
            config/build-manifest.json
