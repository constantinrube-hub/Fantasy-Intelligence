name: Capture FIE Pregame Weather Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 1-11 1 *"
    - cron: "43 */6 * 8-12 0,1,3,4,5,6"

jobs:
  calendar:
    uses: ./.github/workflows/_fie-calendar-policy.yml
    with:
      purpose: weather
  capture:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_fie-evidence-capture-reusable.yml
    with:
      capture_kind: weather
    permissions:
      contents: write
