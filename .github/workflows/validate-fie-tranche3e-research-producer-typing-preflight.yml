name: FIE Controlled Implementation — Tranche 3E Research Producer Typing Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche3e-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Verify completed Tranche 3D ancestry
        run: git merge-base --is-ancestor e89363ab575aa2a35f23cf8e103fb94e2ea37f8e HEAD

      - name: Require characterization-only source scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/validate-fie-tranche3e-research-producer-typing-preflight.yml',
              'config/tranche3e-research-producer-typing-preflight.json',
              'docs/audits/TRANCHE3E_RESEARCH_PRODUCER_TYPING_PREFLIGHT.md',
              'config/build-manifest.json',
              'dist/config/build-manifest.json',
              'config/release-gate.json',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'e89363ab575aa2a35f23cf8e103fb94e2ea37f8e..HEAD'],
              text=True,
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Unexpected preflight source changes:\n- ' + '\n- '.join(unexpected))
          print('PASS Tranche 3E characterization-only source scope')
          PY

      - name: Preserve completed 3A through 3D contracts
        run: |
          node research/integrity_tranche3a_replacement_ownership.js --mode target
          node research/integrity_tranche3b_data_client_scope.js --mode target
          node research/integrity_tranche3c_player_identity.js --mode target
          node research/integrity_tranche3c_current_snapshot_identity.js
          node research/integrity_tranche3d_evidence_semantics.js
          python research/integrity_tranche3d_evidence_semantics_characterization.py --mode target

      - name: Preserve six-format and all-league contracts
        run: |
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target
          node research/integrity_tranche3a_all_league_replacement_profiles.js

      - name: Reproduce C10-005 research producer typing gap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/tranche3e
          python research/integrity_tranche1_research_stage_identity.py --mode baseline | tee artifacts/tranche3e/research-stage-identity-baseline.log
          grep -F "KNOWN_GAP_REPRODUCED unified research stages are status-labelled but not typed to exact dedicated producers" artifacts/tranche3e/research-stage-identity-baseline.log

      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require deployable source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('config/release-gate.json').read_text())
          print('STATUS:', data.get('status'))
          if data.get('status') != 'DEPLOYABLE_SOURCE':
              raise SystemExit(1)
          PY

      - name: Capture only deterministic Tranche 3E generated synchronization
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          lines = subprocess.check_output(
              ['git', 'status', '--porcelain', '--untracked-files=all'], text=True
          ).splitlines()
          changed = []
          for line in lines:
              path = line[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path == 'artifacts' or path.startswith('artifacts/'):
                  continue
              changed.append(path)
          allowed = {
              'config/build-manifest.json',
              'dist/config/build-manifest.json',
              'config/release-gate.json',
          }
          unexpected = sorted(set(changed) - allowed)
          if unexpected:
              print('Unexpected source/generated drift:')
              for path in unexpected:
                  print(' -', path)
              raise SystemExit(1)
          out = pathlib.Path('artifacts/tranche3e/generated-sync')
          out.mkdir(parents=True, exist_ok=True)
          for path in sorted(set(changed) & allowed):
              src = pathlib.Path(path)
              dst = out / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          if changed:
              print('TRANCHE3E_PREFLIGHT_SYNC_REQUIRED:', ', '.join(sorted(changed)))
          else:
              print('PASS Tranche 3E preflight generated tree fully synchronized')
          PY

      - name: Upload Tranche 3E preflight evidence and deterministic sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche3e-preflight-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche3e/
            config/release-gate.json
            config/build-manifest.json
