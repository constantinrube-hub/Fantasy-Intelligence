name: FIE Controlled Implementation — Tranche 3D Evidence Semantics Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-historical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout validated Tranche 3D preflight
        uses: actions/checkout@v4
        with:
          ref: cb4c4cacdea3803c5d02ad1c91ff46acde41c5a2
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Reproduce validated evidence-semantics gap
        shell: bash
        run: |
          set -euo pipefail
          python research/integrity_tranche3d_evidence_semantics_characterization.py --mode baseline | tee /tmp/evidence-semantics-baseline.log
          grep -F "KNOWN_GAP_REPRODUCED evidence semantics are fragmented across projection and specialist surfaces" /tmp/evidence-semantics-baseline.log

      - name: Reproduce then-frozen research-stage gap
        shell: bash
        run: |
          set -euo pipefail
          python research/integrity_tranche1_research_stage_identity.py --mode baseline | tee /tmp/research-stage-baseline.log
          grep -F "KNOWN_GAP_REPRODUCED unified research stages are status-labelled but not typed to exact dedicated producers" /tmp/research-stage-baseline.log

      - name: Canonical historical release build
        run: python tools/release_build.py --mode personal

      - name: Require historical deployable source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/release-gate.json').read_text())
          print('STATUS:',d.get('status'))
          if d.get('status')!='DEPLOYABLE_SOURCE':
              raise SystemExit(1)
          PY
