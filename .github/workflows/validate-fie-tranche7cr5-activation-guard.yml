name: FIE Controlled Implementation — Tranche 7C-R5 Activation Guard
on:
  push:
    branches: [audit-implementation-2026-09]
    paths:
      - 'research/m10_prospective_activation_guard.py'
      - 'research/integrity_m10_prospective_activation_guard_test.py'
      - '.github/workflows/validate-fie-tranche7cr5-activation-guard.yml'
      - 'config/repository-lifecycle-contract.json'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r research/requirements.txt
      - run: python research/integrity_m10_prospective_activation_guard_test.py
      - run: python research/integrity_tranche5c_documentation_lifecycle.py --mode target
