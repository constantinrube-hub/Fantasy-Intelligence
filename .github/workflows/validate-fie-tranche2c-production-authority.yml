name: FIE Controlled Implementation — Tranche 2C Production Authority

on:
  push:
    branches:
      - audit-implementation-2026-09
    paths:
      - "config/release.json"
      - "config/model-config.json"
      - "config/tranche2c-production-authority.json"
      - "app/core/decision-service.js"
      - "app/generated/model-config.js"
      - "app/generated/release.js"
      - "functions/release.js"
      - "research/integrity_decision_service_test.js"
      - "research/integrity_release_versions_test.py"
      - "research/integrity_tranche2c_production_authority.py"
      - "docs/current/ARCHITECTURE.md"
      - "docs/current/HANDOFF.md"
      - "docs/current/DEPLOYMENT.md"
      - "docs/current/CHANGE_GUIDE.md"
      - "docs/audits/TRANCHE2C_PRODUCTION_AUTHORITY.md"
      - "config/build-manifest.json"
      - "dist/config/build-manifest.json"
      - "dist/config/release.json"
      - "dist/config/model-config.json"
      - "dist/app/core/decision-service.js"
      - "dist/app/generated/model-config.js"
      - "dist/app/generated/release.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche2c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Verify validated Tranche 2B ancestry
        run: git merge-base --is-ancestor a0e9617598777a9aab60389ea0d44211c51cd038 HEAD

      - name: Preserve Tranche 2A and 2B targets
        run: |
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche1_six_format_runtime_characterization.js --mode target
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target
          python research/integrity_tranche2b_responsive_primary_actions.py

      - name: Generate authority descriptors
        run: |
          python research/generate_model_config.py
          python research/generate_release_descriptor.py

      - name: Production authority target
        run: |
          python research/integrity_tranche2c_production_authority.py
          node research/integrity_decision_service_test.js

      - name: Keep unrelated Tranche 1 gaps frozen
        run: |
          node research/integrity_tranche1_replacement_parity_characterization.js --mode baseline
          node research/integrity_tranche1_data_client_scope_characterization.js --mode baseline
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode baseline
          python research/integrity_tranche1_research_stage_identity.py --mode baseline

      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require deployable source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("config/release-gate.json").read_text())
          print("STATUS:",d.get("status"))
          if d.get("status")!="DEPLOYABLE_SOURCE":
              raise SystemExit(1)
          PY

      - name: Require no generated drift except deterministic manifest sync
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, pathlib, shutil
          lines=subprocess.check_output(['git','status','--porcelain'],text=True).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip()
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              changed.append(path)
          allowed={'config/build-manifest.json','dist/config/build-manifest.json'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
              print('Unexpected generated/source drift:')
              for p in unexpected: print(' -',p)
              raise SystemExit(1)
          out=pathlib.Path('artifacts/tranche2c/generated-sync')
          out.mkdir(parents=True,exist_ok=True)
          for p in sorted(set(changed)&allowed):
              dest=out/p
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dest)
          if changed:
              print('MANIFEST_SYNC_REQUIRED:', ', '.join(sorted(changed)))
          else:
              print('PASS generated tree fully synchronized')
          PY

      - name: Upload Tranche 2C evidence and deterministic manifest sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche2c-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche2c/
            config/release-gate.json
            config/build-manifest.json
