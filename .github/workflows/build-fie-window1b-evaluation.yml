name: Build FIE Window 1B Season Preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fie-window1b-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Window 1B contracts
        run: |
          python research/integrity_window1b_evaluation_test.py
          python research/integrity_window1b_pr2_ownership_test.py
          python research/integrity_15point_completion_test.py

      - name: Build frozen manual season preview
        run: python research/window1b_evaluation.py season-preview

      - name: Commit only Window 1B season-preview outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FIE Evaluation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/research/evaluation/2026/preseason/season-preview-v1.json \
            data/research/evaluation/2026/preseason/season-preview-v1.md
          if git diff --cached --quiet; then
            echo "No Window 1B season-preview change"
            exit 0
          fi
          git commit -m "Build FIE Window 1B season preview"
          git fetch origin main
          git rebase origin/main
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
