name: FIE Controlled Implementation — Tranche 3B Data Access Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-historical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout validated 3B preflight target
        uses: actions/checkout@v4
        with:
          ref: c96cbb4fb6df5f3383de5d4aa818817d9d84c3c3
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Reproduce validated preflight findings
        run: |
          node research/integrity_tranche3a_replacement_ownership.js --mode target
          node research/integrity_tranche3a_all_league_replacement_profiles.js
          node research/integrity_tranche1_data_client_scope_characterization.js --mode baseline
          node research/integrity_tranche3b_data_client_scope.js --mode baseline
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode baseline
          python research/integrity_tranche1_research_stage_identity.py --mode baseline

      - name: Canonical historical release build
        run: python tools/release_build.py --mode personal

      - name: Require historical deployable source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/release-gate.json').read_text())
          print('STATUS:',d.get('status'))
          if d.get('status')!='DEPLOYABLE_SOURCE': raise SystemExit(1)
          PY
