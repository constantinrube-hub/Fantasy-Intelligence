name: Editorial UI candidate comparison
on:
  push:
    branches: ['ui/editorial-*']
  pull_request:
    paths:
      - 'app/ui/**'
      - 'app/portfolio-home.js'
      - 'index.html'
      - 'research/*editorial*'
      - '.github/workflows/validate-fie-editorial-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editorial-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 1272eed30faf9548c128677a2e45e99bafed819a
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disclosure contract
        working-directory: candidate
        run: |
          node research/integrity_editorial_disclosure_test.js
          node research/integrity_editorial_weekly_test.js
          node research/integrity_editorial_waiver_test.js
          node research/integrity_editorial_overview_test.js
          node research/integrity_editorial_context_test.js
          node research/integrity_editorial_draft_preparation_test.js
          node research/integrity_editorial_live_draft_test.js
          node research/integrity_editorial_draft_refresh_test.js
          node research/integrity_editorial_draft_review_test.js
          python research/integrity_editorial_waiver_evidence_test.py
          python research/integrity_editorial_reports_test.py
      - name: Install browser QA dependency
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/fie-ui-qa" playwright@1.58.2
          node "$RUNNER_TEMP/fie-ui-qa/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare frozen baseline and candidate
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa
        run: node candidate/research/editorial_browser_qa.js baseline/dist candidate/dist
      - name: Weekly populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/weekly
        run: node candidate/research/editorial_weekly_browser_qa.js candidate/dist
      - name: Waiver populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/waivers
        run: node candidate/research/editorial_waiver_browser_qa.js candidate/dist
      - name: Portfolio and Home populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/overviews
        run: node candidate/research/editorial_overview_browser_qa.js candidate/dist
      - name: Roster, Players, Trades and League populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/context
        run: node candidate/research/editorial_context_browser_qa.js candidate/dist
      - name: Reports and Research populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/reports
        run: node candidate/research/editorial_reports_browser_qa.js candidate/dist
      - uses: actions/checkout@v4
        with:
          ref: 941e2514b3a329a6f93e48f2fb7dfca6bc5133e6
          path: phase06
      - name: Cross-format, recovery, keyboard, zoom and performance journeys
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/journeys
        run: node candidate/research/editorial_journey_browser_qa.js candidate/dist phase06/dist
      - name: Pre-draft preparation populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/preparation
        run: node candidate/research/editorial_draft_preparation_browser_qa.js candidate/dist
      - name: Live draft populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/live-draft
        run: node candidate/research/editorial_live_draft_browser_qa.js candidate/dist
      - name: Post-draft review populated fixture review
        env:
          FIE_UI_PLAYWRIGHT: ${{ runner.temp }}/fie-ui-qa/node_modules/playwright
          FIE_UI_QA_OUTPUT: ${{ runner.temp }}/editorial-ui-qa/draft-review
        run: node candidate/research/editorial_draft_review_browser_qa.js candidate/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-ui-comparison
          path: ${{ runner.temp }}/editorial-ui-qa
          if-no-files-found: warn
