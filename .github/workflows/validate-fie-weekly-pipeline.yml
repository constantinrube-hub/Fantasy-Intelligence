name: Validate FIE Weekly Pipeline

on:
  workflow_dispatch:
  push:
    branches: ['fix/p0-*', 'ops/p0-*']
  pull_request:
    paths:
      - '.github/workflows/build-fie-current.yml'
      - 'research/waiver_v2_source_adapter.py'
      - 'research/waiver_v2_event_ledger.py'
      - 'research/build_waiver_v2_label_batch.py'
      - 'research/integrity_waiver_v2_label_batch_test.py'
      - 'research/waiver_v2_validation.py'
      - 'research/waiver_v2_population.py'
      - 'research/waiver_v2_corrected_challenger.py'
      - 'research/validate_waiver_v2_population.py'
      - 'research/integrity_waiver_v2_population_test.py'
      - 'config/waiver-v2-zero-outcome-contract.json'
      - 'config/waiver-v2-global-identity-outcome-extension.json'
      - 'config/waiver-v2-corrected-label-challenger.json'
      - 'data/research/waiver-v2/population/**'
      - 'research/validate_waiver_v2_validation.py'
      - 'research/integrity_waiver_v2_validation_test.py'
      - 'config/waiver-v2-statistical-methodology.json'
      - 'data/research/waiver-v2/model-validation/**'
      - 'research/run_waiver_v2_historical_ledger.py'
      - 'research/integrity_waiver_v2_source_adapter_test.py'
      - 'research/integrity_waiver_v2_event_ledger_test.py'
      - '.github/workflows/build-fie-window1c-weekly-actions.yml'
      - '.github/workflows/build-fie-window1d-optimal-waiver.yml'
      - '.github/workflows/validate-fie-weekly-pipeline.yml'
      - 'research/weekly_context_audit.py'
      - 'research/integrity_weekly_context_audit_test.py'
      - 'research/weekly_player_performance.py'
      - 'research/integrity_weekly_player_performance_test.py'
      - 'research/weekly_usage_table.py'
      - 'research/integrity_weekly_usage_table_test.py'
      - 'research/weekly_usage_identity_crosswalk.py'
      - 'research/integrity_weekly_usage_identity_crosswalk_test.py'
      - 'research/weekly_usage_historical_identity.py'
      - 'research/integrity_weekly_usage_historical_identity_test.py'
      - 'research/append_m10_real_outcomes.py'
      - 'research/integrity_m10_real_outcomes_test.py'
      - 'research/weekly_m10_outcome_review.py'
      - 'research/integrity_weekly_m10_outcome_review_test.py'
      - 'research/preserve_m10_profile_snapshot.py'
      - 'research/integrity_m10_frozen_profile_snapshot_test.py'
      - 'research/run_m10_prospective_weekly_capture.py'
      - 'research/m10_prospective_capture_contract.py'
      - 'research/integrity_m10_prospective_r8c_workflow_test.py'
      - 'data/research/prospective/m10/outcomes/**'
      - 'docs/audits/M10_REAL_OUTCOME_EVALUATION_DESIGN.md'
      - 'research/weekly_portfolio_surface.py'
      - 'research/build_current_snapshot.py'
      - 'research/integrity_weekly_portfolio_surface_test.py'
      - 'research/weekly_opponent_exposure.py'
      - 'research/integrity_weekly_opponent_exposure_test.py'
      - 'research/weekly_decision_ledger.py'
      - 'research/integrity_weekly_decision_ledger_test.py'
      - 'config/roadmap-research-registry.json'
      - 'config/weekly-usage-dictionary.json'
      - 'research/roadmap_research_inventory.py'
      - 'research/integrity_roadmap_research_inventory_test.py'
      - 'research/integrity_draft_worker_lifecycle_test.js'
      - 'research/weekly_lineup_operational_evidence.py'
      - 'research/in_season_pr2_weekly_lineups.py'
      - 'research/integrity_in_season_pr2_weekly_lineups_test.py'
      - 'research/weekly_lineup_review.py'
      - 'research/integrity_weekly_lineup_review_test.py'
      - 'research/joint_scenario_engine.py'
      - 'research/research_bid_curve.py'
      - 'research/draft_scenario_review.py'
      - 'research/scenario_readiness.py'
      - 'research/integrity_joint_scenario_engine_test.py'
      - 'research/research_source_archive.py'
      - 'research/research_feature_tables.py'
      - 'research/research_snap_identity.py'
      - 'research/research_snap_convention.py'
      - 'config/source-contracts/nflverse-snaps-v1/**'
      - 'research/integrity_research_snap_identity_test.py'
      - 'research/research_rest_context.py'
      - 'research/research_experiment_runner.py'
      - 'research/research_strategy_replay.py'
      - 'research/integrity_research_feature_lab_test.py'
      - 'research/strict_sleeper_baseline.py'
      - 'research/paired_forecast_metrics.py'
      - 'research/integrity_paired_forecast_metrics_test.py'
      - 'research/weekly_pr2_baseline_archive.py'
      - 'research/integrity_weekly_pr2_baseline_archive_test.py'
      - 'research/weekly_report_bundle.py'
      - 'research/weekly_product_readiness.py'
      - 'research/integrity_weekly_report_bundle_test.py'
      - 'research/weekly_evidence_audit.py'
      - 'research/integrity_weekly_evidence_audit_test.py'
      - 'app/decision-engines.js'
      - 'app/draft-monte-carlo-worker.js'
      - 'research/integrity_monte_carlo_worker_test.js'
      - 'research/weekly_pipeline_readiness.py'
      - 'research/integrity_weekly_pipeline_readiness_test.py'
      - 'research/integrity_m10_legal_roster_assignment_test.py'
      - 'research/workflow_usability.py'
      - 'research/integrity_workflow_usability_test.py'
      - 'research/integrity_tranche5c_documentation_lifecycle.py'
      - 'research/release_gate.py'
      - 'research/build_app_manifest.py'
      - 'config/repository-lifecycle-contract.json'
      - 'config/workflow-usability-monitor.json'
      - 'docs/current/WEEKLY_OPERATIONS.md'
      - 'docs/audits/CHOPPED_ACTIVE_FIELD_SOURCE_CONTRACT.md'

permissions:
  contents: read

concurrency:
  group: fie-weekly-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Validate focused weekly contracts
        run: |
          python research/integrity_m10_real_outcomes_test.py
          python research/integrity_waiver_v2_label_batch_test.py
          python research/integrity_waiver_v2_validation_test.py
          python research/integrity_waiver_v2_population_test.py
          python research/integrity_weekly_m10_outcome_review_test.py
          python research/integrity_m10_frozen_profile_snapshot_test.py
          python research/integrity_m10_prospective_r8c_workflow_test.py
          python research/integrity_m10_legal_roster_assignment_test.py
          python research/integrity_weekly_context_audit_test.py
          python research/integrity_weekly_player_performance_test.py
          python research/integrity_weekly_usage_table_test.py
          python research/integrity_weekly_usage_identity_crosswalk_test.py
          python research/integrity_weekly_usage_historical_identity_test.py
          python research/integrity_weekly_pr2_baseline_archive_test.py
          python research/integrity_paired_forecast_metrics_test.py
          python research/integrity_research_feature_lab_test.py
          python research/integrity_research_snap_identity_test.py
          python research/integrity_joint_scenario_engine_test.py
          python research/integrity_weekly_portfolio_surface_test.py
          python research/integrity_in_season_pr2_weekly_lineups_test.py
          python research/integrity_weekly_opponent_exposure_test.py
          python research/integrity_weekly_report_bundle_test.py
          python research/integrity_weekly_decision_ledger_test.py
          python research/integrity_roadmap_research_inventory_test.py
          node research/integrity_monte_carlo_worker_test.js
          node research/integrity_draft_worker_lifecycle_test.js
          python research/integrity_weekly_pipeline_readiness_test.py
          python research/integrity_workflow_usability_test.py
          python research/integrity_workflow_season_calendar_test.py
          python research/integrity_tranche5c_documentation_lifecycle.py --mode target
      - name: Deterministic personal release and full integrity gate
        run: python tools/release_build.py --mode personal
      - name: Replay immutable waiver research artifacts
        run: >-
          python research/validate_waiver_v2_validation.py
          --validation-report data/research/waiver-v2/model-validation/2026-10-12/revision-1/validation-report.json
          --expected-sha256 941b9c902c86753ceef020f50b770227412f3654ed6aaae058656c75de104107
      - name: Replay source population and corrected research challenger
        run: >-
          python research/validate_waiver_v2_population.py
          --population-report data/research/waiver-v2/population/2026-10-12/revision-1/population-report.json
          --expected-sha256 07d9e99ff622b5072e0dc8799aab5f7e3195864ca03a0efb29c86e5997745cd9
          --corrected-report data/research/waiver-v2/population/2026-10-12/revision-1/corrected-challenger/corrected-challenger-report.json
          --corrected-sha256 6f2474cfc5b25b5cd03b266d31c40c96ffc80f8c52f78bf830ced09e858901d4
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-weekly-pipeline-validation
          path: |
            config/build-manifest.json
            config/release-gate.json
            dist/config/build-manifest.json
          retention-days: 21
