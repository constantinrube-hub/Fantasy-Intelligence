name: Build FIE Window 1D Optimal Waiver

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: Optional single Sleeper League ID. Leave blank for every enabled league.
        required: false
        type: string
      season:
        description: Optional season; blank resolves from the operational NFL calendar
        required: false
        type: string
      week:
        description: Optional NFL week; blank resolves from the regular-season schedule
        required: false
        type: string
      max_history_seasons:
        description: Same-league history chain depth
        required: false
        default: '2'
        type: string
      max_current_age_hours:
        description: Fail-closed current-snapshot freshness limit
        required: false
        default: '36'
        type: string
  workflow_run:
    workflows: ["Build FIE Window 1C Weekly Actions"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: fie-window1d-optimal-waiver-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calendar:
    uses: ./.github/workflows/_fie-calendar-policy.yml
    with:
      purpose: optimal_waiver
  upstream:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.receipt.outputs.available }}
    steps:
      - name: Check this Window 1C run's artifact and job result
        id: receipt
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.payload.workflow_run.id;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id, filter: 'latest'
            });
            const producer = jobs.find(job => job.name === 'weekly-actions');
            if (!producer) throw new Error(`Window 1C run ${run_id} has no weekly-actions job`);
            if (producer.conclusion === 'skipped') {
              core.setOutput('available', 'false');
              await core.summary.addRaw(`Window 1C run ${run_id} skipped weekly-actions; Window 1D is not due.\n`).write();
              return;
            }
            if (producer.conclusion !== 'success') {
              throw new Error(`Window 1C weekly-actions concluded ${producer.conclusion}`);
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id
            });
            if (!artifacts.some(artifact => artifact.name === 'fie-weekly-inputs' && !artifact.expired)) {
              throw new Error(`Window 1C run ${run_id} completed weekly-actions without a live fie-weekly-inputs receipt`);
            }
            core.setOutput('available', 'true');
      - uses: actions/checkout@v4
        if: steps.receipt.outputs.available == 'false'
        with:
          ref: main
      - name: Record expected upstream no-op
        if: steps.receipt.outputs.available == 'false'
        shell: bash
        run: |
          mkdir -p .cache
          echo '{"schema":"fie-weekly-pipeline-inputs-v1","status":"NO_DUE","reason_codes":["PIPELINE_UPSTREAM_NOT_DUE"]}' > .cache/fie-weekly-inputs.json
          python research/workflow_usability.py emit \
            --workflow-path .github/workflows/build-fie-window1d-optimal-waiver.yml \
            --workflow-name "Build FIE Window 1D Optimal Waiver" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status success --adapter weekly-pipeline \
            --dependency-file .cache/fie-weekly-inputs.json
      - name: Upload expected no-op evidence
        if: steps.receipt.outputs.available == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21
  build:
    needs: [calendar, upstream]
    if: always() && needs.calendar.outputs.allowed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || needs.upstream.outputs.available == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research audit dependencies
        run: pip install -r research/requirements.txt

      - name: Validate Window 1D contract
        run: |
          python -m py_compile research/window1d_optimal_waiver.py
          python research/integrity_window1d_optimal_waiver_test.py
          python research/integrity_workflow_decision_context_test.py

      - name: Validate weekly pipeline contract
        run: python research/integrity_weekly_pipeline_readiness_test.py

      - name: Download this Window 1C run's verified inputs
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: fie-weekly-inputs
          path: .cache/upstream
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify published current inputs
        id: readiness
        shell: bash
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_AS_OF: ${{ inputs.as_of_utc }}
          INPUT_AGE: ${{ inputs.max_current_age_hours }}
        run: |
          set -euo pipefail
          args=(--stage waiver --archive --event-path "$GITHUB_EVENT_PATH" --max-current-age-hours "${INPUT_AGE:-36}")
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            args+=(--upstream-inputs .cache/upstream/fie-weekly-inputs.json)
          fi
          if [ -n "${INPUT_SEASON:-}" ]; then args+=(--season "$INPUT_SEASON"); fi
          if [ -n "${INPUT_WEEK:-}" ]; then args+=(--week "$INPUT_WEEK"); fi
          if [ -n "${INPUT_LEAGUE_ID:-}" ]; then args+=(--league-id "$INPUT_LEAGUE_ID"); fi
          if [ -n "${INPUT_AS_OF:-}" ]; then args+=(--as-of-utc "$INPUT_AS_OF"); fi
          python research/weekly_pipeline_readiness.py "${args[@]}"
          cat .cache/fie-weekly-inputs.json >> "$GITHUB_STEP_SUMMARY"

      - name: Build optimal waiver portfolio
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        env:
          INPUT_LEAGUE_ID: ${{ steps.readiness.outputs.league_id }}
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
          INPUT_AS_OF: ${{ steps.readiness.outputs.as_of_utc }}
          INPUT_HISTORY: ${{ inputs.max_history_seasons }}
          INPUT_AGE: ${{ inputs.max_current_age_hours }}
        run: |
          set -euo pipefail
          HISTORY="${INPUT_HISTORY:-2}"
          AGE="${INPUT_AGE:-36}"
          args=(portfolio --max-history-seasons "$HISTORY" --max-current-age-hours "$AGE" --output-index .cache/window1d-output.json)
          if [ -n "${INPUT_LEAGUE_ID:-}" ]; then args+=(--league-id "$INPUT_LEAGUE_ID"); fi
          if [ -n "${INPUT_SEASON:-}" ]; then args+=(--season "$INPUT_SEASON"); fi
          if [ -n "${INPUT_WEEK:-}" ]; then args+=(--week "$INPUT_WEEK"); fi
          args+=(--as-of-utc "$INPUT_AS_OF")
          python research/window1d_optimal_waiver.py "${args[@]}"

      - name: Add this invocation's operational report to workflow summary
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          index=json.loads(Path('.cache/window1d-output.json').read_text())
          print(Path(index['report_markdown']).read_text(encoding='utf-8'))
          PY

      - name: Audit prospective checkpoint deadlines
        if: steps.readiness.outputs.ready == 'true'
        env:
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="data/operations/weekly-pipeline/$INPUT_SEASON/week_$(printf '%02d' "$INPUT_WEEK")/evidence-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python research/weekly_evidence_audit.py --season "$INPUT_SEASON" --week "$INPUT_WEEK" --output "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure newest completed-week player performance report
        if: steps.readiness.outputs.ready == 'true'
        env:
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          python research/weekly_player_performance.py --season "$INPUT_SEASON" --week "$INPUT_WEEK" --ensure-completed >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve retrospective usage table from the completed report
        if: steps.readiness.outputs.ready == 'true'
        env:
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          python research/weekly_usage_table.py --season "$INPUT_SEASON" --week "$INPUT_WEEK" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture current roster and independent projection surface
        if: steps.readiness.outputs.ready == 'true'
        env:
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="data/operations/weekly-pipeline/$INPUT_SEASON/week_$(printf '%02d' "$INPUT_WEEK")/portfolio-surface-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python research/weekly_portfolio_surface.py --season "$INPUT_SEASON" --week "$INPUT_WEEK" --output "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish weekly report coverage bundle
        if: steps.readiness.outputs.ready == 'true'
        env:
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="data/operations/weekly-pipeline/$INPUT_SEASON/week_$(printf '%02d' "$INPUT_WEEK")/report-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          SURFACE="data/operations/weekly-pipeline/$INPUT_SEASON/week_$(printf '%02d' "$INPUT_WEEK")/portfolio-surface-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python research/weekly_report_bundle.py --season "$INPUT_SEASON" --week "$INPUT_WEEK" --portfolio-surface "$SURFACE" --output "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive unchanged owner recommendations in decision ledger
        if: steps.readiness.outputs.ready == 'true'
        env:
          INPUT_SEASON: ${{ steps.readiness.outputs.season }}
          INPUT_WEEK: ${{ steps.readiness.outputs.week }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="data/operations/weekly-pipeline/$INPUT_SEASON/week_$(printf '%02d' "$INPUT_WEEK")/decision-ledger-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python research/weekly_decision_ledger.py --season "$INPUT_SEASON" --week "$INPUT_WEEK" --output "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit only Window 1D research outputs
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FIE Waiver Bot"
          git config user.email "actions@users.noreply.github.com"
          SEASON="$(python -c "import json; print(json.load(open('.cache/window1d-output.json'))['season'])")"
          git add "data/research/evaluation/$SEASON"
          git add "data/operations/weekly-pipeline/$SEASON"
          if [ -d "data/operations/weekly-performance/$SEASON" ]; then git add "data/operations/weekly-performance/$SEASON"; fi
          if [ -d "data/operations/weekly-usage/$SEASON" ]; then git add "data/operations/weekly-usage/$SEASON"; fi
          if git diff --cached --quiet; then
            echo "No Window 1D evaluation change"
            exit 0
          fi
          git commit -m "Build FIE Window 1D optimal waiver evidence"
          git fetch origin main
          git rebase origin/main
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload verified weekly input receipt
        if: always() && hashFiles('.cache/fie-weekly-inputs.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-weekly-inputs
          path: .cache/fie-weekly-inputs.json
          retention-days: 21

      - name: Emit workflow usability evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python research/workflow_usability.py emit \
            --workflow-path .github/workflows/build-fie-window1d-optimal-waiver.yml \
            --workflow-name "Build FIE Window 1D Optimal Waiver" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status "$JOB_STATUS" --adapter weekly-pipeline \
            --dependency-file .cache/fie-weekly-inputs.json \
            --source-file .cache/window1d-output.json

      - name: Upload workflow usability evidence
        if: always() && hashFiles('.cache/fie-workflow-usability.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21
