name: Validate FIE V9.3.3A-C

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/current-snapshot-store.js'
      - 'app/v9.3.3-runtime-integrity.js'
      - 'research/integrity_v933abc_test.py'
      - '.github/workflows/validate-fie-v933abc.yml'

permissions:
  contents: read

jobs:
  validate-v933abc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app/current-snapshot-store.js
          node --check app/v9.3.3-runtime-integrity.js
      - name: V9.3.3A-C runtime integrity
        run: python research/integrity_v933abc_test.py
