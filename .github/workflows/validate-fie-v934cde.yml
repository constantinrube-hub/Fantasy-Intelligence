name: Validate FIE V9.3.4C-E

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/current-snapshot-store.js'
      - 'app/v9.3.4c-weekly-context.js'
      - 'app/v9.3.4d-starter-economics.js'
      - 'app/v9.3.4e-return-scoring.js'
      - 'research/integrity_v934cde_test.py'
      - 'research/smoke_v934cde.mjs'
      - '.github/workflows/validate-fie-v934cde.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app/current-snapshot-store.js
          node --check app/v9.3.4c-weekly-context.js
          node --check app/v9.3.4d-starter-economics.js
          node --check app/v9.3.4e-return-scoring.js
      - name: V9.3.4C-E structural integrity
        run: python research/integrity_v934cde_test.py
      - name: V9.3.4C-E semantic smoke
        run: node research/smoke_v934cde.mjs
