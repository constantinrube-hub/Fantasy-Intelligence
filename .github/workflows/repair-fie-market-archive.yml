name: Repair FIE Market Archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quarantine unverifiable eligible snapshots
        run: python research/repair_market_archive.py
      - name: Audit repository readiness
        run: python research/production_readiness.py
      - name: Commit archive repair
        run: |
          if git diff --quiet -- data/research/market data/research/quarantine; then
            echo "No market archive changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/market data/research/quarantine
          git commit -m "Quarantine unverifiable FIE market snapshots"
          git push
