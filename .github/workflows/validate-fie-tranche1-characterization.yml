name: FIE Controlled Implementation — Tranche 1 Characterization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche1-frozen
  cancel-in-progress: true

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout frozen Tranche 1 baseline
        uses: actions/checkout@v4
        with:
          ref: 309aebf047ee2f250d8a7612aedb0bf6ff5c4455
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Run frozen Tranche 1 characterization suite
        run: |
          python research/tranche1_characterization.py \
            --mode baseline \
            --output-dir artifacts/tranche1

      - name: Re-run canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require frozen deployable baseline
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          d=json.loads(Path("config/release-gate.json").read_text())
          print("STATUS:",d.get("status"))
          if d.get("status")!="DEPLOYABLE_SOURCE":
              raise SystemExit(1)
          PY2
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::Frozen Tranche 1 baseline no longer builds deterministically."
            git status --short -- dist
            exit 1
          fi

      - name: Upload frozen Tranche 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche1-frozen-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            artifacts/tranche1/tranche1-characterization.json
            artifacts/tranche1/tranche1-characterization.md
            config/release-gate.json
            config/build-manifest.json
