name: Build FIE V9.7.4 Exact M9 Comparator Audit

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Sleeper League ID"
        required: true
        type: string
      league_format:
        description: "League format (used only if historical backbone must be rebuilt)"
        required: true
        default: "REDRAFT"
        type: choice
        options: [REDRAFT, DYNASTY, CHOPPED, REDRAFT_BESTBALL, DYNASTY_BESTBALL, AUTO]
      season:
        description: "Output season folder"
        required: true
        default: "2026"
        type: string

permissions:
  contents: write

concurrency:
  group: fie-v974-comparator-${{ inputs.league_id }}
  cancel-in-progress: false

jobs:
  comparator-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Validate inputs
        env:
          LID: ${{ inputs.league_id }}
          SEASON: ${{ inputs.season }}
        shell: bash
        run: |
          [[ "$LID" =~ ^[0-9]{6,32}$ ]] || { echo "Invalid league id" >&2; exit 2; }
          [[ "$SEASON" =~ ^20[0-9]{2}$ ]] || { echo "Invalid season" >&2; exit 2; }
          echo "FIE_LEAGUE_ID=$LID" >> "$GITHUB_ENV"
          echo "FIE_SEASON=$SEASON" >> "$GITHUB_ENV"
          echo "FIE_LEAGUE_ROOT=data/research/leagues/$LID" >> "$GITHUB_ENV"
          echo "FIE_DERIVED=.cache/fie-research/leagues/$LID/derived" >> "$GITHUB_ENV"
          echo "FIE_STRATEGY_OUT=data/research/leagues/$LID/performance/$SEASON/strategy" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r research/requirements.txt

      - name: V9.7.4 deterministic integrity
        run: |
          python -m py_compile research/preseason_projection_v4.py research/integrity_v974_preseason_test.py research/validate_v974_preseason.py
          python research/integrity_v974_preseason_test.py

      - name: Preserve committed league state before cache restore
        shell: bash
        run: |
          rm -rf /tmp/fie-v974-committed-league /tmp/fie-v974-registry.json
          if [ -d "$FIE_LEAGUE_ROOT" ]; then
            mkdir -p /tmp/fie-v974-committed-league
            cp -a "$FIE_LEAGUE_ROOT"/. /tmp/fie-v974-committed-league/
          fi
          if [ -f data/research/leagues/registry.json ]; then
            cp data/research/leagues/registry.json /tmp/fie-v974-registry.json
          fi

      - name: Restore existing research cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fie-research/leagues/${{ inputs.league_id }}
            data/research/leagues/${{ inputs.league_id }}
            data/research/leagues/registry.json
            data/research/dst
            data/research/kicker
          key: fie-v974-${{ runner.os }}-${{ inputs.league_id }}-${{ inputs.league_format }}-${{ hashFiles('research/fie_research.py','research/fie_m4.py','research/fie_m7.py','research/preseason_projection.py','research/preseason_projection_v2.py','research/preseason_projection_v3.py','research/preseason_projection_v4.py') }}
          restore-keys: |
            fie-strategy-v1-${{ runner.os }}-${{ inputs.league_id }}-${{ inputs.league_format }}-
            fie-m789-m8-v1-${{ runner.os }}-${{ inputs.league_id }}-${{ inputs.league_format }}-

      - name: Restore committed state over cache
        shell: bash
        run: |
          if [ -d /tmp/fie-v974-committed-league ]; then
            mkdir -p "$FIE_LEAGUE_ROOT"
            rsync -a /tmp/fie-v974-committed-league/ "$FIE_LEAGUE_ROOT"/
          fi
          if [ -f /tmp/fie-v974-registry.json ]; then
            cp /tmp/fie-v974-registry.json data/research/leagues/registry.json
          fi

      - name: Ensure historical backbone
        env:
          FORMAT: ${{ inputs.league_format }}
        shell: bash
        run: |
          if [ ! -f "$FIE_LEAGUE_ROOT/milestone1.json" ] || [ ! -f "$FIE_DERIVED/player_week.csv.gz" ]; then
            python research/build_performance_research.py \
              --league-id "$FIE_LEAGUE_ID" \
              --format "$FORMAT" \
              --season "$FIE_SEASON" \
              --rebuild-base \
              --stop-after-m8
          fi
          test -f "$FIE_LEAGUE_ROOT/milestone1.json"
          test -f "$FIE_DERIVED/player_week.csv.gz"

      - name: Run V9.7.4 exact comparator audit
        shell: bash
        run: |
          mkdir -p "$FIE_STRATEGY_OUT"
          IDENTITY_ARGS=()
          if [ -f "$FIE_DERIVED/player_identity.csv.gz" ]; then
            IDENTITY_ARGS=(--identity "$FIE_DERIVED/player_identity.csv.gz")
          fi
          python research/preseason_projection_v4.py \
            --player-week "$FIE_DERIVED/player_week.csv.gz" \
            "${IDENTITY_ARGS[@]}" \
            --scoring-json "$FIE_LEAGUE_ROOT/milestone1.json" \
            --output-json "$FIE_STRATEGY_OUT/preseason_v974_validation.json" \
            --predictions-csv "$FIE_STRATEGY_OUT/preseason_v974_predictions.csv" \
            --calibration-csv "$FIE_STRATEGY_OUT/preseason_v974_calibration.csv"
          python research/validate_v974_preseason.py "$FIE_STRATEGY_OUT"

      - name: Governance guard
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["FIE_STRATEGY_OUT"])/"preseason_v974_validation.json"
          x=json.loads(p.read_text())
          g=x["governance"]
          assert g["production_activation"] is False
          assert g["canonical_m9_modified"] is False
          assert g["canonical_m1_modified"] is False
          assert g["runtime_projection_modified"] is False
          assert g["market_inputs_used"] is False
          assert g["adp_inputs_used"] is False
          assert g["v973_statistical_gates_changed"] is False
          assert x["production_activation_allowed"] is False
          print(
              "PASS V9.7.4 governance",
              "review=", x.get("football_model_promotion_review_positions", []),
              "expected=", x.get("expected_season_points_ready_positions", []),
          )
          PY

      - name: Upload V9.7.4 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fie-v974-comparator-${{ inputs.league_id }}-${{ inputs.season }}
          if-no-files-found: error
          path: |
            data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/strategy/preseason_v974_validation.json
            data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/strategy/preseason_v974_predictions.csv
            data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/strategy/preseason_v974_calibration.csv

      - name: Commit V9.7.4 audit outputs
        shell: bash
        run: |
          git config user.name "FIE Strategy Research Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            "$FIE_STRATEGY_OUT/preseason_v974_validation.json" \
            "$FIE_STRATEGY_OUT/preseason_v974_predictions.csv" \
            "$FIE_STRATEGY_OUT/preseason_v974_calibration.csv"

          if git diff --cached --quiet; then
            echo "No V9.7.4 audit changes to commit"
            exit 0
          fi

          git commit -m "Build V9.7.4 exact M9 comparator audit for league $FIE_LEAGUE_ID"

          echo "Post-commit worktree status:"
          git status --short
          if ! git diff --quiet; then
            echo "::warning::Discarding unstaged tracked cache side-effects before rebase."
            git diff --name-status
            git restore --worktree .
          fi
          if ! git diff --cached --quiet; then
            echo "Unexpected staged changes remain after V9.7.4 commit." >&2
            git diff --cached --name-status >&2
            exit 1
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
