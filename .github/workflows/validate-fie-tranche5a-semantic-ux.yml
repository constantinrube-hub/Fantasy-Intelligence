name: FIE Controlled Implementation — Tranche 5A Semantic UX

on:
  push:
    branches: [audit-implementation-2026-09]
    paths:
      - "app/core/semantic-ux.js"
      - "app/decision-ui.js"
      - "app/decision-engines.js"
      - "app/value-finder.js"
      - "app/research-report-ui.js"
      - "index.html"
      - "config/semantic-ux-contract.json"
      - "config/tranche5a-semantic-ux.json"
      - "research/integrity_tranche5a_semantic_ux.js"
      - "research/integrity_tranche5a_semantic_ux_rank_identity.py"
      - "research/release_gate.py"
      - "research/build_app_manifest.py"
      - "research/current_snapshot_storage.py"
      - "tools/sync_league_app_snapshots.py"
      - "docs/audits/TRANCHE5A_SEMANTIC_UX_TARGET.md"
      - ".github/workflows/validate-fie-tranche5a-semantic-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche5a-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify authorized preflight ancestry
        run: git merge-base --is-ancestor 638fe42ca2d1e656572983154b42c98745c35396 HEAD
      - name: Validate semantic UX contract and target labels
        run: |
          node research/integrity_tranche5a_semantic_ux.js
          python research/integrity_tranche5a_semantic_ux_rank_identity.py --mode target
      - name: Preserve completed contracts
        run: |
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche3a_replacement_ownership.js --mode target
          node research/integrity_tranche3b_data_client_scope.js --mode target
          node research/integrity_tranche3c_player_identity.js --mode target
          node research/integrity_tranche3d_evidence_semantics.js
          python research/integrity_tranche3d_evidence_semantics_characterization.py --mode target
          python research/integrity_tranche3e_research_producer_typing.py
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target
          node research/integrity_tranche3a_all_league_replacement_profiles.js
      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal
      - name: Require deployable source
        run: python -c "import json; assert json.load(open('config/release-gate.json'))['status'] == 'DEPLOYABLE_SOURCE'"
      - name: Capture deterministic generated synchronization
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, shutil, subprocess
          lines = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()
          changed=[]
          for line in lines:
              path=line[3:].strip().split(' -> ')[-1]
              if not (path == 'artifacts' or path.startswith('artifacts/')): changed.append(path)
          allowed={'config/build-manifest.json','dist/config/build-manifest.json','config/release-gate.json','dist/index.html','dist/app/core/semantic-ux.js','dist/app/decision-ui.js','dist/app/decision-engines.js','dist/app/value-finder.js','dist/app/research-report-ui.js'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected: raise SystemExit('Unexpected source/generated drift:\n- '+'\n- '.join(unexpected))
          out=pathlib.Path('artifacts/tranche5a/generated-sync'); out.mkdir(parents=True,exist_ok=True)
          for path in sorted(set(changed)&allowed):
              dst=out/path; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(path,dst)
          print('TRANCHE5A_TARGET_SYNC_REQUIRED:', ', '.join(sorted(changed)) if changed else 'none')
          PY
      - name: Upload Tranche 5A target evidence and deterministic sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche5a-target-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche5a/
            config/release-gate.json
            config/build-manifest.json
