name: FIE Controlled Implementation — Tranche 3B Data Access Reliability

on:
  push:
    branches:
      - audit-implementation-2026-09
    paths:
      - "app/core/data-client.js"
      - "app/core/research-report-service.js"
      - "dist/app/core/data-client.js"
      - "dist/app/core/research-report-service.js"
      - "research/integrity_tranche3b_research_report_transport.js"
      - "config/tranche3b-data-access-target.json"
      - "docs/audits/TRANCHE3B_DATA_ACCESS_RELIABILITY.md"
      - "config/build-manifest.json"
      - "dist/config/build-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fie-controlled-tranche3b-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout implementation branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Verify validated 3B preflight ancestry
        run: git merge-base --is-ancestor c96cbb4fb6df5f3383de5d4aa818817d9d84c3c3 HEAD

      - name: Preserve Tranche 2A, 2B and 2C targets
        run: |
          node research/integrity_tranche2a_six_format_contract.js
          node research/integrity_tranche1_six_format_runtime_characterization.js --mode target
          node research/integrity_tranche1_all_league_runtime_profiles.js --mode target
          python research/integrity_tranche2b_responsive_primary_actions.py
          python research/integrity_tranche2c_production_authority.py
          node research/integrity_decision_service_test.js

      - name: Preserve closed Tranche 3A economics
        run: |
          node research/integrity_tranche3a_replacement_ownership.js --mode target
          node research/integrity_tranche1_replacement_parity_characterization.js --mode target
          node research/integrity_v93_scarcity_runtime_test.js
          node research/integrity_tranche3a_all_league_replacement_profiles.js

      - name: Tranche 3B scope-safe DataClient target
        run: |
          node research/integrity_tranche3b_data_client_scope.js --mode target
          node research/integrity_tranche1_data_client_scope_characterization.js --mode target

      - name: Tranche 3B canonical research-report transport target
        run: |
          node research/integrity_tranche3b_research_report_transport.js
          python research/integrity_tranche1_direct_fetch_allowlist.py --mode target

      - name: Preserve cache and fast-switch behavior
        run: |
          node research/integrity_v931_persistent_cache_test.js
          node research/integrity_league_fast_switch_runtime_test.js

      - name: Keep later research-stage identity gap frozen
        run: python research/integrity_tranche1_research_stage_identity.py --mode baseline

      - name: Require source and dist target mirrors match before build
        run: |
          cmp -s app/core/data-client.js dist/app/core/data-client.js || { echo 'DataClient dist mirror mismatch'; exit 1; }
          cmp -s app/core/research-report-service.js dist/app/core/research-report-service.js || { echo 'ResearchReportService dist mirror mismatch'; exit 1; }

      - name: Canonical deterministic release build
        run: python tools/release_build.py --mode personal

      - name: Require deployable source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('config/release-gate.json').read_text())
          print('STATUS:',d.get('status'))
          if d.get('status')!='DEPLOYABLE_SOURCE': raise SystemExit(1)
          PY

      - name: Capture only deterministic manifest reconciliation
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, pathlib, shutil
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed=[]
          for line in lines:
              p=line[3:].strip()
              if ' -> ' in p:p=p.split(' -> ',1)[1]
              if p=='artifacts' or p.startswith('artifacts/'):continue
              changed.append(p)
          allowed={'config/build-manifest.json','dist/config/build-manifest.json'}
          unexpected=sorted(set(changed)-allowed)
          if unexpected:
              print('Unexpected source/generated drift:')
              for p in unexpected: print(' -',p)
              raise SystemExit(1)
          out=pathlib.Path('artifacts/tranche3b/generated-sync')
          out.mkdir(parents=True,exist_ok=True)
          for p in sorted(set(changed)&allowed):
              dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,dest)
          if changed:
              print('MANIFEST_SYNC_REQUIRED:', ', '.join(sorted(changed)))
          else:
              print('PASS Tranche 3B generated tree fully synchronized')
          PY

      - name: Upload Tranche 3B evidence and deterministic manifest sync
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fie-controlled-tranche3b-target-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/tranche3b/
            config/release-gate.json
            config/build-manifest.json
