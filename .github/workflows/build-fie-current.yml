name: Refresh FIE Current Season

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Optional League ID. Leave blank to refresh every enabled league in registry.json."
        required: false
        type: string
      season:
        description: "Optional season override"
        required: false
        type: string
      week:
        description: "Optional week override"
        required: false
        type: string
      governance_mode:
        description: "KEEP keeps each league override, AUTO enables normal promotion checks, CONTROL forces that league/all targeted leagues to fallback."
        required: false
        default: "KEEP"
        type: choice
        options: [KEEP, AUTO, CONTROL]
  schedule:
    - cron: "17 5,11,17,23 * 1,2,8-12 *"

permissions:
  contents: write

concurrency:
  group: fie-current-season
  cancel-in-progress: true

jobs:
  refresh-current:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify multi-league production code
        run: |
          python research/integrity_m6_test.py
          python research/integrity_dst_test.py
          python research/integrity_kicker_test.py
          python research/integrity_v89_test.py
          python research/test_league_profile.py
          python research/integrity_multileague_test.py
          python research/integrity_market_archive_test.py
          python research/integrity_decision_engines_test.py
          python research/integrity_draft_rank_sort_test.py
          python research/integrity_portfolio_home_test.py
          python research/integrity_custom_league_rules_test.py
          python research/integrity_decision_validation_test.py
          python research/integrity_current_features_test.py
          node research/integrity_runtime_foundation_test.js
          node research/integrity_v9_model_runtime_test.js
          node research/integrity_monte_carlo_worker_test.js
          node research/integrity_value_finder_runtime_test.js
          node research/integrity_top100_optimizer_runtime_test.js
          python research/integrity_bulk_onboarding_test.py --config-only
      - name: Resolve target leagues
        env:
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
        run: |
          python - <<'PY' > /tmp/fie_leagues.txt
          import json, os, re
          supplied=str(os.environ.get('INPUT_LEAGUE_ID') or '').strip()
          if supplied:
              if not re.fullmatch(r'[0-9]{6,32}', supplied): raise SystemExit('Invalid League ID')
              print(supplied)
          else:
              reg=json.load(open('data/research/leagues/registry.json'))
              for lid,row in sorted((reg.get('leagues') or {}).items()):
                  if row.get('enabled',True) and row.get('current_refresh',True): print(lid)
          PY
          if [ ! -s /tmp/fie_leagues.txt ]; then
            echo "No registered leagues to refresh. Run the legacy migration/add-league workflow first." >&2
            exit 2
          fi
          cat /tmp/fie_leagues.txt
      - name: Build league-specific current snapshots and governance
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          GOV_MODE: ${{ inputs.governance_mode }}
        shell: bash
        run: |
          MODE="${GOV_MODE:-KEEP}"
          while read -r LID; do
            [ -z "$LID" ] && continue
            ROOT="data/research/leagues/$LID"
            PROFILE="$ROOT/profile.json"
            echo "=== Refreshing league $LID ==="
            if [ ! -f "$PROFILE" ]; then echo "Skipping $LID: profile.json missing" >&2; continue; fi
            if ! python research/validate_m4_bundle.py "$ROOT/milestone4.json" \
              || ! python research/validate_m5_bundle.py "$ROOT/milestone5.json" \
              || ! python research/validate_m6_bundle.py "$ROOT/milestone6.json"; then
              echo "Skipping $LID: historical bundles invalid/incomplete" >&2
              continue
            fi
            ARGS="--league-id $LID --league-profile $PROFILE --m4-bundle $ROOT/milestone4.json --m5-bundle $ROOT/milestone5.json --m6-bundle $ROOT/milestone6.json --cache-dir .cache/fie-current/leagues/$LID --sleeper-archive data/research/market/sleeper --output $ROOT/current/milestone5_current.json"
            if [ -n "$INPUT_SEASON" ]; then ARGS="$ARGS --season $INPUT_SEASON"; fi
            if [ -n "$INPUT_WEEK" ]; then ARGS="$ARGS --week $INPUT_WEEK"; fi
            if ! python research/build_current_snapshot.py $ARGS; then
              echo "Current build failed for $LID; preserving previous snapshot." >&2
              continue
            fi
            GOV="--league-id $LID --league-profile $PROFILE --m4-bundle $ROOT/milestone4.json --m5-bundle $ROOT/milestone5.json --m6-bundle $ROOT/milestone6.json --current-snapshot $ROOT/current/milestone5_current.json --operator-override $ROOT/governance/operator_override.json --global-operator-override data/research/governance/operator_override.json --output $ROOT/governance/active_release.json"
            if [ "$MODE" = "AUTO" ] || [ "$MODE" = "CONTROL" ]; then
              python research/fie_governance.py $GOV --mode "$MODE" --persist-mode
            else
              python research/fie_governance.py $GOV
            fi
          done < /tmp/fie_leagues.txt
      - name: Refresh specialist scoring inventories
        run: |
          python research/fie_dst.py inventory --registry data/research/leagues/registry.json --output data/research/dst/scoring_inventory.json
          python research/fie_kicker.py inventory --registry data/research/leagues/registry.json --output data/research/kicker/scoring_inventory.json
      - name: Audit production readiness
        run: python research/production_readiness.py
      - name: Commit current snapshots, market captures, and governance
        run: |
          if git diff --quiet -- data/research/leagues data/research/market/sleeper data/research/dst data/research/kicker; then
            echo "Current-season artifacts unchanged."
            exit 0
          fi
          git config user.name "FIE Current Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/leagues data/research/market/sleeper data/research/dst data/research/kicker
          git commit -m "Refresh FIE league-specific current intelligence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
