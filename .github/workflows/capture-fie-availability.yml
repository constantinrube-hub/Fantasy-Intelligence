name: Capture Daily FIE Availability Evidence

on:
  workflow_dispatch:
  schedule:
    # Prospective evidence cannot be reconstructed cleanly after the fact.
    - cron: "29 8 * 9-12 *"
      timezone: "Europe/Berlin"
    - cron: "29 8 1-10 1 *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

concurrency:
  group: fie-availability-daily
  cancel-in-progress: false

jobs:
  calendar:
    uses: ./.github/workflows/_fie-calendar-policy.yml
    with:
      purpose: availability
  capture:
    needs: calendar
    if: needs.calendar.outputs.allowed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check automatic season window
        id: capture_policy
        if: github.event_name == 'schedule'
        run: python research/capture_fie_availability.py --schedule-check >> "$GITHUB_OUTPUT"
      - name: Verify capture contract
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        run: |
          python research/integrity_availability_capture_test.py
          python research/capture_fie_availability.py --fixture --output-root /tmp/fie-availability
      - name: Capture immutable availability evidence
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        run: |
          args=()
          if [ "${{ github.event_name }}" = "schedule" ]; then args+=(--automatic); fi
          python research/capture_fie_availability.py --output-root data/research/availability/sleeper --output-index .cache/availability-output.json "${args[@]}"
          python research/build_fie_point_in_time_evidence_report.py
          python research/validate_fie_point_in_time_evidence_report.py --verify-deterministic
      - name: Summarize exact availability capture
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('.cache/availability-output.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as handle:
              handle.write(f"Availability capture: {result['capture_status']}\n\n")
              handle.write(f"Snapshot: `{result.get('snapshot_path', 'none')}`\n\n")
              for group, values in result.get('coverage', {}).items():
                  handle.write(f"- {group}: {values['rows']} rows; {values['rows_with_team']} with team; {values['rows_with_injury_status']} with injury status\n")
              handle.write('\nMissing provider fields remain unknown. No playing probabilities or model adjustments.\n')
          PY
      - name: Commit first-write evidence
        if: steps.capture_policy.outputs.capture_allowed != 'false'
        run: |
          git config user.name "FIE Availability Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/availability/sleeper data/research/portfolio/2026/point-in-time-evidence-report.json
          if git diff --cached --quiet; then echo "Today's immutable availability snapshot already exists"; exit 0; fi
          git commit -m "Capture FIE daily availability evidence"
          git fetch origin main
          git rebase origin/main
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Emit workflow usability evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CAPTURE_ALLOWED: ${{ steps.capture_policy.outputs.capture_allowed }}
        run: |
          python research/workflow_usability.py emit \
            --workflow-path .github/workflows/capture-fie-availability.yml \
            --workflow-name "Capture Daily FIE Availability Evidence" \
            --run-id "$GITHUB_RUN_ID" --event "$GITHUB_EVENT_NAME" \
            --job-status "$JOB_STATUS" --adapter availability-index \
            --source-file .cache/availability-output.json \
            --policy-allowed "$CAPTURE_ALLOWED"

      - name: Upload workflow usability evidence
        if: always() && hashFiles('.cache/fie-workflow-usability.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fie-workflow-usability
          path: .cache/fie-workflow-usability.json
          retention-days: 21
