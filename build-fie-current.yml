name: Refresh FIE Current Season

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Optional Sleeper league ID. If blank, the empirical M5 scoring profile is reused."
        required: false
        type: string
      season:
        description: "Optional season override"
        required: false
        type: string
      week:
        description: "Optional week override"
        required: false
        type: string
      governance_mode:
        description: "KEEP keeps the versioned override, AUTO enables normal promotion checks, CONTROL forces rollback."
        required: false
        default: "KEEP"
        type: choice
        options: [KEEP, AUTO, CONTROL]
  schedule:
    # UTC. Four refreshes/day during the NFL/preseason months; the builder itself fails closed if data are unavailable.
    - cron: "17 5,11,17,23 * 1,2,8-12 *"

permissions:
  contents: write

concurrency:
  group: fie-current-season
  cancel-in-progress: true

jobs:
  refresh-current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install -r research/requirements.txt
      - name: Verify current-production code
        run: |
          python research/integrity_m6_test.py
          python research/integrity_v89_test.py
          python research/validate_m4_bundle.py data/research/milestone4.json
          python research/validate_m5_bundle.py data/research/milestone5.json
          python research/validate_m6_bundle.py data/research/milestone6.json
      - name: Build current-season snapshot
        env:
          INPUT_LEAGUE_ID: ${{ inputs.league_id }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          ARGS="--output data/research/current/milestone5_current.json --sleeper-archive data/research/market/sleeper"
          if [ -n "$INPUT_LEAGUE_ID" ]; then ARGS="$ARGS --league-id $INPUT_LEAGUE_ID"; fi
          if [ -n "$INPUT_SEASON" ]; then ARGS="$ARGS --season $INPUT_SEASON"; fi
          if [ -n "$INPUT_WEEK" ]; then ARGS="$ARGS --week $INPUT_WEEK"; fi
          python research/build_current_snapshot.py $ARGS
      - name: Build promotion/rollback manifest
        env:
          GOV_MODE: ${{ inputs.governance_mode }}
        run: |
          MODE="${GOV_MODE:-KEEP}"
          if [ "$MODE" = "AUTO" ] || [ "$MODE" = "CONTROL" ]; then
            python research/fie_governance.py --mode "$MODE" --persist-mode --output data/research/governance/active_release.json
          else
            python research/fie_governance.py --output data/research/governance/active_release.json
          fi
      - name: Commit current snapshot, immutable market capture, and governance
        run: |
          if git diff --quiet -- data/research/current data/research/market/sleeper data/research/governance; then
            echo "Current-season artifacts unchanged."
            exit 0
          fi
          git config user.name "FIE Current Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research/current data/research/market/sleeper data/research/governance
          git commit -m "Refresh FIE current-season intelligence"
          git push
