name: Build FIE Strategy Research Stack

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Sleeper League ID"
        required: true
        type: string
      league_format:
        description: "Strategic league format"
        required: true
        default: "REDRAFT"
        type: choice
        options: [REDRAFT, DYNASTY, CHOPPED, REDRAFT_BESTBALL, DYNASTY_BESTBALL, AUTO]
      season:
        description: "Season / market board"
        required: true
        default: "2026"
        type: string
      adp_key:
        description: "Sleeper ADP field. AUTO derives the correct market from the league profile."
        required: true
        default: "AUTO"
        type: choice
        options: [AUTO, adp_ppr, adp_half_ppr, adp_std, adp_2qb, adp_dynasty_ppr, adp_dynasty_half_ppr, adp_dynasty_std, adp_dynasty_2qb]
      current_pick:
        description: "Optional current draft pick for research action labels"
        required: false
        default: ""
        type: string
      next_pick:
        description: "Optional next user pick"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: fie-strategy-${{ inputs.league_id }}
  cancel-in-progress: false

jobs:
  strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Validate inputs
        env:
          LID: ${{ inputs.league_id }}
          SEASON: ${{ inputs.season }}
        run: |
          [[ "$LID" =~ ^[0-9]{6,32}$ ]] || { echo "Invalid league id" >&2; exit 2; }
          [[ "$SEASON" =~ ^20[0-9]{2}$ ]] || { echo "Invalid season" >&2; exit 2; }
          echo "FIE_LEAGUE_ID=$LID" >> "$GITHUB_ENV"
          echo "FIE_SEASON=$SEASON" >> "$GITHUB_ENV"
          echo "FIE_LEAGUE_ROOT=data/research/leagues/$LID" >> "$GITHUB_ENV"
          echo "FIE_DERIVED=.cache/fie-research/leagues/$LID/derived" >> "$GITHUB_ENV"
          echo "FIE_STRATEGY_OUT=data/research/leagues/$LID/performance/$SEASON/strategy" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: New-stack deterministic integrity
        run: |
          python -m compileall -q research
          python research/integrity_fie_strategy_stack_test.py
          python research/integrity_v973_preseason_test.py
          python research/capture_fie_availability.py --fixture --output-root /tmp/fie-availability
          python research/preseason_projection_v2.py --fixture --output /tmp/preseason_v2.json
      - name: Preserve committed league state before broad cache restore
        shell: bash
        run: |
          rm -rf /tmp/fie-committed-league /tmp/fie-committed-registry.json
          if [ -d "$FIE_LEAGUE_ROOT" ]; then
            mkdir -p /tmp/fie-committed-league
            cp -a "$FIE_LEAGUE_ROOT"/. /tmp/fie-committed-league/
          fi
          if [ -f data/research/leagues/registry.json ]; then
            cp data/research/leagues/registry.json /tmp/fie-committed-registry.json
          fi
      - name: Restore existing M7-M9 research cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/fie-research/leagues/${{ inputs.league_id }}
            data/research/leagues/${{ inputs.league_id }}
            data/research/leagues/registry.json
            data/research/dst
            data/research/kicker
          key: fie-strategy-v1-${{ runner.os }}-${{ inputs.league_id }}-${{ inputs.league_format }}-${{ hashFiles('research/fie_research.py','research/fie_m2.py','research/fie_m3.py','research/fie_m4.py','research/fie_m5.py','research/fie_m6.py','research/fie_m7.py','research/fie_m8.py','research/fie_m9.py','research/preseason_projection.py','research/preseason_projection_v2.py','research/preseason_projection_v3.py','research/fie_strategy_stack.py') }}
          restore-keys: |
            fie-m789-m8-v1-${{ runner.os }}-${{ inputs.league_id }}-${{ inputs.league_format }}-
      - name: Restore committed state over cache
        shell: bash
        run: |
          if [ -d /tmp/fie-committed-league ]; then
            mkdir -p "$FIE_LEAGUE_ROOT"
            rsync -a /tmp/fie-committed-league/ "$FIE_LEAGUE_ROOT"/
          fi
          if [ -f /tmp/fie-committed-registry.json ]; then
            cp /tmp/fie-committed-registry.json data/research/leagues/registry.json
          fi
      - name: Ensure existing M1-M9 backbone and current season board
        env:
          FORMAT: ${{ inputs.league_format }}
        shell: bash
        run: |
          if [ ! -f "$FIE_LEAGUE_ROOT/milestone9.json" ] || [ ! -f "$FIE_DERIVED/player_week.csv.gz" ]; then
            python research/build_performance_research.py --league-id "$FIE_LEAGUE_ID" --format "$FORMAT" --season "$FIE_SEASON" --rebuild-base --stop-after-m8
            python research/build_performance_research.py --league-id "$FIE_LEAGUE_ID" --format "$FORMAT" --season "$FIE_SEASON" --resume-from-m9 --capture-market --build-report
          elif [ ! -f "$FIE_LEAGUE_ROOT/performance/$FIE_SEASON/season_board.csv" ]; then
            python research/build_performance_research.py --league-id "$FIE_LEAGUE_ID" --format "$FORMAT" --season "$FIE_SEASON" --resume-from-m9 --capture-market --build-report
          fi
      - name: Capture today's season market first-write
        run: |
          python research/capture_sleeper_season_market.py --season "$FIE_SEASON" --derived-dir "$FIE_DERIVED" --output-root data/research/market/sleeper
      - name: Capture today's availability evidence (best effort)
        shell: bash
        run: |
          if ! python research/capture_fie_availability.py --output-root data/research/availability/sleeper; then
            echo "::warning::Availability capture failed; strategy research continues because this evidence is prospective and non-blocking."
          fi
      - name: Build V9.7.3-V10.4 research/action stack
        env:
          ADPKEY: ${{ inputs.adp_key }}
          CUR: ${{ inputs.current_pick }}
          NXT: ${{ inputs.next_pick }}
        shell: bash
        run: |
          ARGS=(--league-root "$FIE_LEAGUE_ROOT" --season "$FIE_SEASON" --derived-dir "$FIE_DERIVED" --adp-key "$ADPKEY" --output-dir "$FIE_STRATEGY_OUT")
          if [[ "$CUR" =~ ^[0-9]+$ ]]; then ARGS+=(--current-pick "$CUR"); fi
          if [[ "$NXT" =~ ^[0-9]+$ ]]; then ARGS+=(--next-pick "$NXT"); fi
          python research/build_fie_strategy_stack.py "${ARGS[@]}"
          python research/validate_fie_strategy_stack.py "$FIE_STRATEGY_OUT"
      - name: Governance guard
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['FIE_STRATEGY_OUT'])/'strategy_stack.json'
          x=json.loads(p.read_text()); g=x['governance']
          assert g['auto_activation'] is False
          assert g['canonical_projections_modified'] is False
          assert g['football_model_uses_adp'] is False
          assert g['historical_hindsight_adp_allowed'] is False
          v=x.get('preseason_v973_meta') or {}
          assert v.get('production_activation_allowed') is False
          assert v.get('market_fallback_replacement_validated') is False
          print('PASS strategy governance', x['phases'])
          PY
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: fie-strategy-${{ inputs.league_id }}-${{ inputs.season }}
          if-no-files-found: error
          path: |
            data/research/leagues/${{ inputs.league_id }}/performance/${{ inputs.season }}/strategy/**
            data/research/market/sleeper/${{ inputs.season }}/season_market_*.jsonl.gz
            data/research/market/sleeper/${{ inputs.season }}/season_market_*.meta.json
            data/research/availability/sleeper/**
      - name: Commit research outputs and immutable market evidence
        run: |
          git config user.name "FIE Strategy Research Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$FIE_STRATEGY_OUT" "data/research/market/sleeper/$FIE_SEASON" data/research/availability/sleeper || true
          if git diff --cached --quiet; then echo "No strategy changes to commit"; exit 0; fi
          git commit -m "Build FIE strategy research for league $FIE_LEAGUE_ID"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
